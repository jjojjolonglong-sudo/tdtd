<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 집필 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* 잠긴 영역: 옅은 회색 음영 및 편집 차단 */
        .locked-span {
            background-color: #f3f4f6;
            padding: 0.1rem 0.2rem;
            border-radius: 0.2rem;
            user-select: text;
        }
        /* 플레이스홀더 스타일 */
        #editor:empty:before {
            content: "여기에 글을 작성하세요...";
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }
        /* 폰트 스타일 */
        .font-sans-system { font-family: system-ui, -apple-system, sans-serif; }
        .font-gulim { font-family: 'Gulim', '굴림', sans-serif; }
        .font-dodum { font-family: 'Dodum', '돋움', sans-serif; }
        .font-batang { font-family: 'Batang', '바탕', serif; }

        /* 들여쓰기 (1em) */
        .indent-on p, .indent-on div {
            text-indent: 1em;
        }

        /* 줄간격 */
        .leading-tight-custom { line-height: 1.3; }
        .leading-normal-custom { line-height: 1.6; }
        .leading-loose-custom { line-height: 2.0; }

        /* 문단 간격 */
        .para-spacing-on p, .para-spacing-on div { margin-bottom: 1em; }
        .para-spacing-off p, .para-spacing-off div { margin-bottom: 0; }
    </style>
</head>
<body class="bg-white text-gray-900 h-screen flex flex-col m-0 overflow-hidden">

    <!-- 1. 로그인 화면 -->
    <div id="auth-screen" class="fixed inset-0 bg-gray-50 flex items-center justify-center z-50">
        <div class="p-8 bg-white rounded-lg shadow-md w-96">
            <h2 class="mb-6 text-xl font-bold text-center text-gray-800">심플 집필 로그인</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="이메일" class="w-full p-2 mb-4 border rounded outline-none focus:border-blue-500" required>
                <input type="password" id="password" placeholder="비밀번호" class="w-full p-2 mb-4 border rounded outline-none focus:border-blue-500" required>
                <button type="submit" class="w-full py-2 text-white bg-blue-600 rounded hover:bg-blue-700 mb-4">로그인</button>
            </form>
            <div id="status-box" class="p-2 text-xs bg-gray-100 rounded text-gray-600 min-h-[30px] text-center">
                대기 중...
            </div>
        </div>
    </div>

    <!-- 2. 메인 집필 화면 -->
    <div id="app-screen" class="hidden flex flex-col h-full">
        <header class="flex items-center justify-between px-6 py-3 border-b border-gray-200 text-xs select-none bg-gray-50 flex-wrap gap-2 flex-shrink-0">
            <div class="flex items-center gap-2">
                <input type="text" id="file-name" value="untitled" class="border border-gray-300 rounded px-2 py-1 bg-white text-sm font-medium outline-none focus:border-blue-500 w-32" title="파일 이름 (.md 자동 적용)">
                <span class="text-gray-500 text-xs font-mono">.md</span>
                <button id="btn-new" class="px-2.5 py-1 bg-gray-200 hover:bg-gray-300 rounded font-medium text-gray-700">+ 새 파일</button>
                <button id="btn-save" class="px-2.5 py-1 bg-blue-600 text-white hover:bg-blue-700 rounded font-medium">수동저장</button>
                <span id="auto-save-status" class="text-gray-400 text-[11px] ml-1">자동저장 켜짐</span>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <select id="select-font" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="system">기본 고딕</option>
                    <option value="gulim">굴림체</option>
                    <option value="dodum">돋움체</option>
                    <option value="batang">바탕체</option>
                </select>

                <select id="select-align" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="justify">정렬: 양쪽</option>
                    <option value="left">정렬: 왼쪽</option>
                    <option value="center">정렬: 가운데</option>
                    <option value="right">정렬: 오른쪽</option>
                </select>

                <button id="btn-indent" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">들여쓰기: 끔</button>

                <select id="select-leading" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="normal">줄간격: 보통(1.6)</option>
                    <option value="tight">줄간격: 좁게(1.3)</option>
                    <option value="loose">줄간격: 넓게(2.0)</option>
                </select>

                <button id="btn-para" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">문단간격: 없음</button>
                <button id="btn-margin" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">여백: 있음</button>
                
                <button id="btn-lock" class="px-2 py-1 bg-amber-100 text-amber-800 hover:bg-amber-200 rounded font-medium">🔒 잠금</button>
                <button id="btn-unlock" class="px-2 py-1 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded font-medium">🔓 잠금 해제</button>
                
                <button id="btn-logout" class="text-gray-500 hover:text-gray-800 ml-2">로그아웃</button>
            </div>
        </header>

        <main id="main-container" class="flex-1 overflow-y-auto w-full transition-all duration-300">
            <div id="content-wrapper" class="max-w-3xl mx-auto px-6 py-12 w-full min-h-full flex flex-col">
                <div id="editor" contenteditable="true" spellcheck="false" class="outline-none flex-1 font-sans-system leading-normal-custom para-spacing-off" style="text-align: justify;"></div>
            </div>
        </main>

        <footer class="fixed bottom-4 right-6 px-3 py-1 bg-gray-800 text-white text-xs rounded-full shadow-lg opacity-80 pointer-events-none select-none z-50">
            공백 미포함 글자수: <span id="char-count">0</span>자
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://rtvvajhsnwkkrmncyfbs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6InJvbmUiLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';

        const statusBox = document.getElementById('status-box');
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const editor = document.getElementById('editor');
        const charCountSpan = document.getElementById('char-count');
        const fileNameInput = document.getElementById('file-name');
        const autoSaveStatus = document.getElementById('auto-save-status');
        const contentWrapper = document.getElementById('content-wrapper');
        
        let appSupabase = null;
        let isWideMargin = true;
        let isIndentOn = false;
        let isParaOn = false;
        let autoSaveTimer = null;

        try {
            appSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            statusBox.innerText = '준비 완료';
        } catch (err) {
            statusBox.innerText = '초기화 에러: ' + err.message;
        }

        async function handleLoginSuccess() {
            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            await loadDocument();
        }

        async function checkUser() {
            if (!appSupabase) return;
            try {
                const { data: { session } } = await appSupabase.auth.getSession();
                if (session) await handleLoginSuccess();
            } catch (err) {
                console.error('세션 확인 에러:', err);
            }
        }
        checkUser();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!appSupabase) {
                alert('Supabase가 초기화되지 않았습니다.');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            statusBox.innerText = '로그인 시도 중...';

            try {
                const { data, error } = await appSupabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('로그인 실패: ' + error.message);
                    statusBox.innerText = error.message;
                } else {
                    await handleLoginSuccess();
                }
            } catch (err) {
                alert('예외 발생: ' + err.message);
                statusBox.innerText = '통신 에러 발생';
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            if (appSupabase) await appSupabase.auth.signOut();
            authScreen.classList.remove('hidden');
            appScreen.classList.add('hidden');
            statusBox.innerText = '대기 중...';
        });

        async function loadDocument() {
            if (!appSupabase) return;
            try {
                const { data: { session } } = await appSupabase.auth.getSession();
                if (!session) return;

                const rawName = fileNameInput.value.trim() || 'untitled';
                const title = rawName.endsWith('.md') ? rawName : rawName + '.md';

                const { data, error } = await appSupabase
                    .from('tdtd_manuscript')
                    .select('*')
                    .eq('user_id', session.user.id)
                    .eq('title', title)
                    .maybeSingle();

                if (data) {
                    editor.innerHTML = data.content || '';
                } else {
                    editor.innerHTML = '';
                }
                updateCharCount();
            } catch (err) {
                console.error('문서 불러오기 실패:', err);
            }
        }

        fileNameInput.addEventListener('change', loadDocument);

        document.getElementById('btn-new').addEventListener('click', () => {
            const newName = prompt("새 파일의 이름을 입력하세요 (예: chapter1):", `file_${Date.now()}`);
            if (!newName) return;
            fileNameInput.value = newName.trim().replace(/\.md$/, '');
            editor.innerHTML = '';
            updateCharCount();
        });

        function updateCharCount() {
            const text = editor.innerText || '';
            const cleanText = text.trim();
            if (!cleanText) {
                charCountSpan.innerText = '0';
                return;
            }
            charCountSpan.innerText = cleanText.replace(/\s/g, '').length;
        }

        async function executeSave(isManual = false) {
            if (!appSupabase) return;
            try {
                const { data: { session } } = await appSupabase.auth.getSession();
                if (!session) return;

                const rawName = fileNameInput.value.trim() || 'untitled';
                const title = rawName.endsWith('.md') ? rawName : rawName + '.md';
                const content = editor.innerHTML;

                const { data: existing } = await appSupabase
                    .from('tdtd_manuscript')
                    .select('id')
                    .eq('user_id', session.user.id)
                    .eq('title', title)
                    .maybeSingle();

                let error = null;
                if (existing) {
                    const res = await appSupabase
                        .from('tdtd_manuscript')
                        .update({ content })
                        .eq('id', existing.id);
                    error = res.error;
                } else {
                    const res = await appSupabase
                        .from('tdtd_manuscript')
                        .insert({ user_id: session.user.id, title, content });
                    error = res.error;
                }

                if (error) {
                    if (isManual) alert('저장 실패: ' + error.message);
                    autoSaveStatus.innerText = '저장 실패';
                } else {
                    if (isManual) alert('저장되었습니다.');
                    autoSaveStatus.innerText = '저장됨';
                    setTimeout(() => { autoSaveStatus.innerText = '자동저장 켜짐'; }, 2000);
                }
