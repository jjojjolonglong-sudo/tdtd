<script>
/* ---------- 연결 설정: 아래 값은 공개돼도 되는 값입니다 (비밀 키는 절대 넣지 마세요) ---------- */
const SB='https://rtvvajhsnwkkrmncyfbs.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';
const DEFAULT_MEDIA='';   // Cloudflare Worker 주소를 여기 적거나, 앱의 ⚙ 설정에서 입력해도 됩니다
const LS=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const MEDIA=(LS('bkbk_media')||DEFAULT_MEDIA).replace(/\/$/,'');

/* ---------- Supabase 로그인 / 데이터 접근 (필요한 기능만 직접 구현) ---------- */
const SES=()=>{try{return JSON.parse(localStorage.getItem('bkbk_sb')||'null')}catch(e){return null}};
const setSES=s=>{try{s?localStorage.setItem('bkbk_sb',JSON.stringify(s)):localStorage.removeItem('bkbk_sb')}catch(e){}};
async function gotrue(grant,body){
  const r=await fetch(`${SB}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:ANON,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.msg||j.error||'HTTP '+r.status);
  const s={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,user:{id:j.user&&j.user.id,email:j.user&&j.user.email}};setSES(s);return s;
}
let rfp=null;
async function token(){
  let s=SES();if(!s)throw new Error('not signed in');
  if(s.expires_at-Date.now()<60000){rfp=rfp||gotrue('refresh_token',{refresh_token:s.refresh_token}).finally(()=>{rfp=null});s=await rfp}
  return s.access_token;
}
const login=(email,password)=>gotrue('password',{email,password});
async function logout(){const s=SES();setSES(null);try{if(s)await fetch(`${SB}/auth/v1/logout`,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+s.access_token}})}catch(e){}}
async function rest(path,o={}){
  const go=async()=>fetch(`${SB}/rest/v1/${path}`,{...o,headers:{apikey:ANON,Authorization:'Bearer '+await token(),'Content-Type':'application/json',...(o.headers||{})}});
  let r=await go();
  if(r.status==401){const s=SES();if(s){await gotrue('refresh_token',{refresh_token:s.refresh_token});r=await go()}}
  if(!r.ok){let m;try{const j=await r.json();m=j.message||j.hint||JSON.stringify(j)}catch(e){m='HTTP '+r.status}throw new Error(m)}
  return r;
}
const TB={Books:'bkbk_books',Tags:'bkbk_tags',Series:'bkbk_series',Logs:'bkbk_logs',Texts:'bkbk_texts',Words:'bkbk_words'};
/* 열 종류: t 글자 · l 소문자 글자 · i 정수 · n 숫자 · d 날짜 · u uuid · a uuid 배열(앱에서는 쉼표 문자열) */
const SCH={Books:{series:'u',volume:'i',label:'t',author:'u',genre:'a',page:'i',charcount:'n',platform:'u',star:'i',comment:'t',cover:'t',color1:'t',color2:'t',color3:'t',height:'t',thickness:'t'},
  Tags:{name:'t',type:'l'},Series:{name:'t'},
  Logs:{date:'d',book:'u',chapter:'t',onpage:'i',offpage:'i',onpct:'n',offpct:'n'},
  Texts:{date:'d',book:'u',chapter:'t',page:'i',pct:'n',text:'t',notion:'t',tags:'a'},
  Words:{date:'d',book:'u',chapter:'t',page:'i',pct:'n',word:'t',meaning:'t'}};
const UU=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function toDB(sh,r){
  const o={id:r.id};
  for(const[k,t]of Object.entries(SCH[sh])){const v=r[k],e=v===''||v==null;
    o[k]=t=='t'?(e?null:String(v)):t=='l'?String(v||'').toLowerCase():t=='i'?(e||isNaN(v)?null:Math.round(Number(v))):t=='n'?(e||isNaN(v)?null:Number(v)):t=='d'?(e?null:(String(v).slice(0,10)||null)):t=='u'?(e||!UU.test(String(v))?null:String(v)):split(v).filter(x=>UU.test(x))}
  if(sh=='Books'&&o.star==null)o.star=0;
  return o;
}
const fromDB=(sh,r)=>{const o={id:r.id};for(const[k,t]of Object.entries(SCH[sh]))o[k]=t=='a'?(r[k]||[]).join(','):r[k]==null?'':r[k];return o};
async function selAll(sh){
  const out=[];
  for(let off=0;;){
    const r=await rest(`${TB[sh]}?select=*&order=created_at.asc,id.asc&limit=1000&offset=${off}`,{headers:{Prefer:'count=exact'}}),j=await r.json();
    out.push(...j);off+=j.length;const m=(r.headers.get('content-range')||'').match(/\/(\d+)$/);
    if(!j.length||(m?off>=+m[1]:j.length<1000))break;
  }
  return out.map(x=>fromDB(sh,x));
}

    for(let t=0;t<3&&!ok;t++){try{j.del?await remove(j.sheet,j.row.id):await upsert(j.sheet,j.row);ok=true}catch(e){err=e;if(authErr(e))break;if(t<2)await new Promise(r=>setTimeout(r,700*(t+1)))}}

function palette(im){
  const N=64,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,N,N);x.drawImage(im,0,0,N,N);
  const d=x.getImageData(0,0,N,N).data,B={},tot=N*N;
  for(let i=0;i<d.length;i+=4){const k=(d[i]>>4)+','+(d[i+1]>>4)+','+(d[i+2]>>4),b=B[k]=B[k]||[0,0,0,0];b[0]++;b[1]+=d[i];b[2]+=d[i+1];b[3]+=d[i+2]}
  const L=Object.values(B).map(b=>({n:b[0],c:[b[1]/b[0],b[2]/b[0],b[3]/b[0]].map(Math.round)})).sort((a,b)=>b.n-a.n);
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]),sat=c=>{const m=Math.max(...c);return m?(m-Math.min(...c))/m:0},light=c=>Math.min(...c)>228;
  const w=o=>o.n*(light(o.c)?.25:1)*(.5+sat(o.c)),W=[...L].sort((a,b)=>w(b)-w(a));
  const p1=W[0].c,p2=(W.find(o=>dist(o.c,p1)>70&&o.n>=tot*.02)||W.find(o=>dist(o.c,p1)>70)||W[1]||W[0]).c;
  const a=L.filter(o=>o.n>=tot*.01&&dist(o.c,p1)>60&&dist(o.c,p2)>50).sort((a,b)=>sat(b.c)*Math.sqrt(b.n)-sat(a.c)*Math.sqrt(a.n))[0];
  const p3=a?a.c:(p1[0]*.3+p1[1]*.59+p1[2]*.11>140?[34,34,34]:[255,255,255]);
  return[p1,p2,p3].map(c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join(''));
}
function upBusy(d){up=Math.max(0,up+d);const b=$('[data-bsave]');if(b){b.disabled=up>0;b.style.opacity=up?.5:1;b.firstElementChild.textContent=up?'Uploading…':'Save'}}
const scaled=(im,max,q)=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(b=>r({blob:b,url:c.toDataURL('image/jpeg',q)}),'image/jpeg',q))};
function onCover(f){

/* ---------- 렌더 & 이벤트 ---------- */
const ttl=(s,lb,vol,multi)=>{lb=String(lb||'').trim();return!s?'':lb?`${s.name} [${lb}]`:multi&&vol?`${s.name} [${vol}권]`:s.name};
let TM=new Map(),TK=new Map(),SM=new Map(),SN=new Map(),SC=new Map();
const serOf=b=>SM.get(String(b.series))||SN.get(String(b.series));
const tn=v=>TM.has(String(v))?TM.get(String(v)):String(v??''),nz=(v,type)=>{v=String(v??'').trim();return!v?'':TM.has(v)?v:(TK.get(type+'|'+v)||v)};
function calc(){TM=new Map(D.Tags.map(t=>[String(t.id),t.name]));TK=new Map(D.Tags.map(t=>[String(t.type).toLowerCase()+'|'+t.name,String(t.id)]));BM=new Map(D.Books.map(b=>[String(b.id),b]));LM=new Map();D.Logs.forEach(l=>{const k=String(l.book),a=LM.get(k);a?a.push(l):LM.set(k,[l])});CS=new Map();LM.forEach((a,k)=>CS.set(k,sess(a)));SM=new Map(D.Series.map(x=>[String(x.id),x]));SN=new Map(D.Series.map(x=>[x.name,x]));SC=new Map();D.Books.forEach(b=>{const k=String(b.series);SC.set(k,(SC.get(k)||0)+1)});D.Books.forEach(b=>{b.authorN=tn(nz(b.author,'author'));b.genreN=split(b.genre).map(x=>tn(nz(x,'genre'))).join(', ');const s=serOf(b);b.name=s?ttl(s,b.label,b.volume,(SC.get(String(b.series))||0)>1):(b.name||'(untitled)')})}
function markShelf(){document.querySelectorAll('#L .sp').forEach(s=>s.classList.toggle('hit',!!shq&&s.dataset.s.includes(shq)));const c=$('#L .sc');if(c)c.classList.toggle('sh-q',!!shq)}
function render(){calc();const pv=$('#L .sc'),lt0=lastTab;lastTab=tab;if(pv&&pv.offsetParent!==null)ls[tab]=pv.scrollTop;
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${t==tab?'on':''}" data-tab="${t}">${t}</button>`).join('');
  const v={Main,Book,Log,Text,Word,Shelf}[tab]();let R=v[1],rt=v[3];
  if(cfg){R=settingsHtml();rt='Settings'}else if(ed)rt=ed.isNew?'New Book':'Edit Book';else if(fm){R=formHtml();rt=(fm.isNew?'New ':'Edit ')+SK[fm.sheet]}
  $('#L').innerHTML=v[0];$('#R').innerHTML=R||'<p class="empty">Empty</p>';$('#lt').textContent=v[2];$('#rt').innerHTML='<button class="btn mb" data-back>◀ Back</button>'+E(rt);$('#grid').dataset.v=view;hydrate();fit();
  if(lt0===tab&&$('#L').offsetParent!==null){const n=$('#L .sc');if(n)n.scrollTop=ls[tab]||0}
  if(tab=='Shelf')markShelf();
}
document.addEventListener('click',async e=>{
  const g=a=>e.target.closest(`[${a}]`);let x;
  document.querySelectorAll('.msp').forEach(p=>{if(!p.parentNode.contains(e.target))p.hidden=true});
  if(e.target.closest('#cfg')){if(ed)cancelEdit(true);fm=null;cfg=true;view='R';render();loadUF();return}
  if(x=g('data-ms')){const p=x.nextElementSibling;p.hidden=!p.hidden;return}
  if(x=g('data-st')){const i=x.parentNode.querySelector('input');i.value=Math.min(10,Math.max(0,P(i.value)+ +x.dataset.st));return}
  if(e.target.closest('#cvup')){$('#cvf').click();return}
  if(x=g('data-tt')){x.classList.toggle('on');const w=x.closest('.chipwrap');w.querySelector('input[type=hidden]').value=[...w.querySelectorAll('[data-tt].on')].map(b=>b.dataset.tt).join(',');return}
  if(x=g('data-ia')){const k=x.dataset.ia;$('#in-'+k).innerHTML=`<input id="ni-${k}" placeholder="New ${k}" maxlength="60"><button type="button" class="btn" data-ic="${k}">OK</button>`;$('#ni-'+k).focus();return}
  if(x=g('data-ic')){const k=x.dataset.ic,v=$('#ni-'+k).value.trim();
    if(k=='genre'){if(!v)return;const id=await addTag(v,'Genre'),w=$('#cw-genre'),on=[...w.querySelectorAll('[data-mc]:checked')].map(c=>c.value);if(!on.includes(String(id)))on.push(String(id));w.outerHTML=msBox('genre',on);$('#cw-genre .msp').hidden=false;return}
    if(!v){$('#in-'+k).innerHTML=k=='theme'?'<button type="button" class="btn" data-ia="theme">+</button>':inl(k,'');return}
    if(k=='series'){const r={name:v};r.id=nid('Series');send('Series',r,false,true);$('#in-'+k).innerHTML=inl(k,r.id);onSeries()}
    else if(k=='theme'){const id=await addTag(v,'Theme'),w=$('#cw-theme'),on=[...w.querySelectorAll('[data-tt].on')].map(b=>b.dataset.tt);if(!on.includes(String(id)))on.push(String(id));w.outerHTML=chipBox('theme',on)}
    else{const id=await addTag(v,k=='platform'?'Platform':'Author');$('#in-'+k).innerHTML=inl(k,id)}
    return}
  if(g('data-fsave')){saveForm();return}
  if(g('data-fcancel')){fm=null;render();return}
  if(g('data-fdel')){if(confirm('삭제할까요?')){const{sheet,row}=fm;fm=null;send(sheet,row,true)}return}
  if(g('data-retry')){wfail.splice(0).forEach(enqueue);$('#msg').innerHTML='';return}
  if(g('data-bsave')){saveBook();return}
  if(g('data-bcancel')){cancelEdit();return}
  if(g('data-bdel')){delBook();return}
  if(x=g('data-bedit')){startEdit(bk(x.dataset.bedit));return}
  if(g('data-bnew')){startEdit(null);return}
  if(g('data-ssave')){const m=$('#s-media').value.trim().replace(/\/$/,'');try{localStorage.setItem('bkbk_media',m)}catch(z){}if(m!==MEDIA){location.reload();return}ufState='saved';setMsg();return}
  if(g('data-logout')){await logout();location.reload();return}
  if(e.target.closest('#lg-go')){doLogin();return}
  if(g('data-sclose')){cfg=false;view='L';render();return}
  if(x=g('data-add')){openForm(x.dataset.add,null,x.dataset.bk);return}
  if(x=g('data-edit')){const[sh,id]=x.dataset.edit.split(':');openForm(sh,D[sh].find(r=>String(r.id)==id));return}
  if(g('data-more')){const sc=$('#R .sc'),st=sc?sc.scrollTop:0;rlim+=40;render();const n=$('#R .sc');if(n)n.scrollTop=st;return}
  if(x=g('data-tab')){if(ed)cancelEdit(true);fm=null;cfg=false;tab=x.dataset.tab;view='L';rlim=40;ls[tab]=0}
  else if(g('data-back')){if(ed)cancelEdit(true);fm=null;cfg=false;view='L'}
  else if(g('data-go'))view='R';
  else if(x=g('data-fb')){const i=x.dataset.fb;F.b.has(i)?F.b.delete(i):F.b.add(i);rlim=40}
  else if(x=g('data-ft')){const i=x.dataset.ft;F.t.has(i)?F.t.delete(i):F.t.add(i);rlim=40}
  else if(g('data-clr')){F.b.clear();F.t.clear();rlim=40}
  else if(g('data-roll')){favPrev=fav;fav=null}
  else if(x=g('data-pg'))pgAll+=+x.dataset.pg;
  else if(x=g('data-fp')){const[k,d]=x.dataset.fp.split(':'),f=FS[k];if(d>0){if(f.s+f.n<f.t){f.h.push(f.s);f.s+=f.n}}else f.s=f.h.pop()||0}
  else if(x=g('data-m'))cal=new Date(cal.getFullYear(),cal.getMonth()+ +x.dataset.m,1);
  else if(x=g('data-b')){if(ed)cancelEdit(true);fm=null;cfg=false;sel=x.dataset.b;view='R'}
  else return;
  render();
});
start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
