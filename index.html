<style>

#hc{flex:1 1 auto;text-align:center;white-space:nowrap;font-size:15px;color:#6b7280}#hc b{color:#111827;font-weight:600;font-variant-numeric:tabular-nums}#hc i{font-style:normal;color:#d1d5db;margin:0 4px}
header.nw #hc{order:3;flex-basis:100%}

.menu button:hover{background:#f3f4f6}

@media (max-width:760px),(hover:none) and (pointer:coarse){#ed{font-size:18px}#hc{display:none}header{padding:6px 10px}.g{gap:3px}.tb{padding:0 6px}.sep{margin:0 2px}}   /* 휴대폰: 본문 18px, 위 글자수 줄은 숨김(아래 줄에 있음) */
#gate p{max-width:440px;line-height:1.7;font-size:15px;margin:0}
</style></head><body>
<div id="gate" class="hide">
 <p>원고를 안전하게 보관하기 위해 저장 폴더를 선택하고 권한을 허용해주세요.<br><small style="color:#6b7280">브라우저 데이터를 삭제하면 폴더 연결이 끊어질 수 있습니다. 같은 폴더를 다시 연결하면 원고가 그대로 불러와집니다.</small></p>
 <button id="gb2" class="tb pri hide" style="padding:10px 20px">이전 폴더 다시 연결</button>
 <button id="gb1" class="tb pri" style="padding:10px 20px">저장 폴더 선택하기</button>
</div>

<header>
 <div class="g">
  <button id="bd" class="ib" title="폴더 변경"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 4.2h4.3l1.5 1.6h6.6v7.4H1.8z"/></svg></button>
  <button id="tt" class="fb" title="눌러서 파일 고르기 · 우클릭(휴대폰은 꾹)으로 이름 바꾸기"><span id="ttn">untitled</span><svg viewBox="0 0 10 10" class="cv" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button><input id="ti" class="hide">
  <span class="sep"></span>
  <button id="bs" class="ib" title="저장"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h8.2l2.8 2.8v8.2h-11z"/><path d="M5 2.5v3.3h5V2.5M4.6 13.5V9.4h6.8v4.1"/></svg></button>
  <button id="be" class="ib txt" title="EPUB 전자책으로 저장 (서식 없이 본문만)"><b>E</b></button>
  <span class="sep"></span>

  <button id="bin" class="ib" hidden title="앱 설치"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.2v8M4.9 7.3 8 10.4l3.1-3.1M2.8 13.6h10.4"/></svg></button>
  <button id="brl" class="ib" title="새로고침"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8.2A5.2 5.2 0 1 1 11.6 4.4"/><path d="M12.3 1.9v3h-3"/></svg></button>
 </div>
 <div id="hc" title="공백 포함 글자수"><span>오늘</span> <b id="hct">0</b> <i>/</i> <span>전체</span> <b id="hca">0</b></div>
 <div class="g">
  <button id="bz" class="tb sw" title="글씨 크기 (누를 때마다 2씩 커지고, 가장 크면 가장 작게)">13</button>
  <button id="bf" class="tb sw" title="글씨체">굴림체</button>
  <button id="ba" class="ib sw" title="커서가 있는 문단 정렬: 양쪽"></button>
  <button id="bl" class="tb sw" title="줄간격">1.6</button>
  <button id="bi" class="ib tg" title="들여쓰기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3.5h7.5M2 7h12M2 10.5h12M2 14h8"/><path d="M2 2.2l2.3 1.3L2 4.8" /></svg></button>
  <button id="bp" class="ib tg" title="문단 간격"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5h12M2 5.5h9M2 10.5h12M2 13.5h9"/></svg></button><span class="sep"></span>
  <button id="bm" class="tb sw" title="여백">여백 중간</button>
  <button id="bv" class="tb tg on" title="날짜별 글자수 기록">기록</button><span class="sep"></span>

<div id="stale" class="hide"><span id="stt"></span><button id="sre">다시 불러오기</button><button id="sgo">그래도 이걸로 쓰기</button></div>
<div id="area">
 <aside id="pomo"><div><button id="pb">초기화</button> <b id="pd" style="margin-left:6px;color:#374151"></b></div><div id="pl"></div></aside>
 <main id="main"><div id="wrap"><div id="ed" contenteditable="true" spellcheck="false"></div></div></main>
</div>
<footer><span id="st">폴더 미지정</span><span id="cc">오늘 0 (0) / 전체 0 (0)</span></footer>
<script>
const $=i=>document.getElementById(i),ed=$('ed'),main=$('main'),wrap=$('wrap'),st=$('st'),cm=$('cm'),tm=$('fm');
const FONTS=[['굴림체',"Gulim,'굴림',sans-serif"],['돋움체',"Dotum,'돋움',sans-serif"],['바탕체',"Batang,'바탕',serif"]],
 FK=['gulim','dodum','batang'],LK=['tight','normal','loose'],LEAD=[1.3,1.6,2],MARG=['없음','좁음','중간','넓음'],MW=[0,1024,768,576],
 AL=[['justify','양쪽','justifyFull'],['left','왼쪽','justifyLeft'],['center','가운데','justifyCenter'],['right','오른쪽','justifyRight']],
 BLK=['DIV','P','H1','H2','H3','H4','H5','H6','LI','UL','OL','BLOCKQUOTE','PRE'];
let S={font:0,lead:1,indent:0,para:0,margin:2},dir=null,saved=null,name='untitled',dirty=false,saving=false,again=false,saveT=0,lastSave=Date.now(),
 pomoOn=!matchMedia('(max-width:760px),(hover:none) and (pointer:coarse)').matches,editing=null,alignI=0,cur=[],statT=0;

/* ---------- 공통 ---------- */
const say=m=>{st.textContent=m;clearTimeout(statT);statT=setTimeout(()=>st.textContent=dir?'자동저장 켜짐':'폴더 미지정',2500)};
const safe=n=>(n||'').replace(/\.(md|txt)$/i,'').replace(/[\\/:*?"<>|]/g,'_').trim()||'untitled';
const blockOf=n=>{if(!n)return null;let b=n.nodeType===3?n.parentElement:n;while(b&&b.parentElement!==ed&&b!==ed)b=b.parentElement;return b&&b!==ed&&ed.contains(b)?b:null};
const inMemo=n=>{n=n&&(n.nodeType===3?n.parentElement:n);return n&&n.closest?n.closest('.memo'):null};
const selMemo=()=>{const s=getSelection();return s.rangeCount?inMemo(s.anchorNode):null};
const locked=b=>b.classList.contains('lk');
/* 메모 제외 텍스트 (글자수·복사·내보내기 공용) */
function txt(n){let s='';for(const c of n.childNodes){if(c.nodeType===3)s+=c.nodeValue;else if(c.nodeType===1&&!c.classList.contains('memo')){if(c.tagName==='BR')s+='\n';else{s+=txt(c);if(BLK.includes(c.tagName)&&s&&!s.endsWith('\n'))s+='\n'}}}return s}
const plain=n=>txt(n).replace(/\n{3,}/g,'\n\n').trim();

/* ---------- 폴더/파일 IO ---------- */
const idb=(m,v)=>new Promise(r=>{const q=indexedDB.open('TdtdAppDB',1);q.onupgradeneeded=()=>q.result.createObjectStore('handles');q.onerror=()=>r(null);
 q.onsuccess=()=>{const o=q.result.transaction('handles',m==='get'?'readonly':'readwrite').objectStore('handles'),x=m==='get'?o.get('savedDirHandle'):o.put(v,'savedDirHandle');x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)}});
async function put(f,d){const h=await dir.getFileHandle(f,{create:true}),w=await h.createWritable();await w.write(d);await w.close()}
async function get(f){try{return await(await(await dir.getFileHandle(f)).getFile()).text()}catch(e){return null}}
/* wkwk 연결용 번호: 파일 맨 첫 줄의 숨김 주석(<!--wk:번호 c=만든시각-->). 본문과 섞이지 않게 열 때 떼어 두었다가 저장할 때 다시 붙여요 */
const WKTAG=/^<!--wk:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?: c=\S+?)?-->/i;
let wkTag='';
const takeTag=t=>{const m=WKTAG.exec(t||'');wkTag=m?m[0]:'';return m?t.slice(m[0].length).replace(/^\r?\n/,''):t};
const newTag=()=>'<!--wk:'+crypto.randomUUID()+' c='+new Date().toISOString()+'-->';
async function headTag(f){try{const x=await(await(await dir.getFileHandle(f)).getFile()).slice(0,200).text();const m=WKTAG.exec(x);return m?m[0]:''}catch(e){return ''}}
async function has(f){try{await dir.getFileHandle(f);return true}catch(e){return false}}

/* ---------- 불러오기 보안: 허용된 태그/속성만 남김 ---------- */
function clean(html){
 const d=new DOMParser().parseFromString(html,'text/html'),out=document.createElement('div');
 (function walk(src,dst){for(const n of src.childNodes){
  if(n.nodeType===3){dst.append(n.nodeValue);continue}
  if(n.nodeType!==1)continue;
  const t=n.tagName;if(t==='SCRIPT'||t==='STYLE'||t==='IFRAME'||t==='OBJECT'||t==='EMBED')continue;
  if(!['DIV','P','BR','SPAN','B','I','U','STRONG','EM'].includes(t)&&!BLK.includes(t)){walk(n,dst);continue}
  const e=document.createElement(BLK.includes(t)&&t!=='DIV'&&t!=='P'?'DIV':t.toLowerCase());
  const m=n.classList.contains('para-memo')||n.classList.contains('memo');
  if(m){e.className='memo';e.setAttribute('contenteditable','false')}
  else if(n.classList.contains('locked-paragraph')||n.classList.contains('lk')){e.className='lk';e.setAttribute('contenteditable','false')}
  else if(n.classList.contains('has-memo'))e.className='has-memo';
  const a=/text-align:\s*(left|right|center|justify)/.exec(n.getAttribute('style')||'');if(a&&!m)e.style.textAlign=a[1];
  if(t!=='BR')walk(n,e);dst.append(e)}})(d.body,out);
 return out}
function load(html){ed.replaceChildren(...clean(html).childNodes);editing=null;ensure();seed();refresh(true)}

/* ---------- 레이아웃 ---------- */
function layout(){
 const W=main.clientWidth;if(!W)return;
 const pn=pomoOn?256:0,mn=ed.querySelector('.memo')?340:0;let l,r;
 if(!S.margin){l=Math.max(24,pn);r=Math.max(24,mn)}
 else{const side=Math.max(24,pn,mn);let w=Math.min(MW[S.margin],W-2*side);w=Math.max(w,Math.min(320,W-48));l=r=Math.max(24,(W-w)/2)}
 wrap.style.paddingLeft=l+'px';wrap.style.paddingRight=r+'px'}
new ResizeObserver(layout).observe(main);
/* 위 줄 가운데 글자수: 자리가 모자라면(버튼 묶음이 밀려 내려가면) 맨 아래 줄 가운데로 */
const hdr=document.querySelector('header'),fitHc=()=>{hdr.classList.remove('nw');const g=hdr.querySelectorAll('.g');if(g[1].offsetTop>g[0].offsetTop+4)hdr.classList.add('nw')};
new ResizeObserver(fitHc).observe(hdr);
function syncMemos(){
 ed.querySelectorAll('.has-memo').forEach(b=>{if(!b.querySelector(':scope>.memo')){b.classList.remove('has-memo');b.style.minHeight=''}});
 ed.querySelectorAll('.memo').forEach(m=>{const b=m.parentElement;if(!b||b===ed)return;
  const f=b.querySelector(':scope>.memo');
  if(f&&f!==m){if(f.textContent.trim()&&m.textContent.trim())f.append(document.createElement('br'));f.append(...m.childNodes);if(m===editing)editing=f;m.remove();return}   // 문단이 합쳐져 메모가 둘이 되면 줄바꿈으로 병합
  const ns=m.nextSibling;if(ns&&!(ns.classList&&ns.classList.contains('memo'))&&m!==editing)b.appendChild(m);   // 메모 뒤에 글이 붙으면 메모를 다시 맨 뒤로
  b.classList.add('has-memo');
  const mb=parseFloat(getComputedStyle(b).marginBottom)||0;b.style.minHeight=Math.max(0,Math.ceil(m.offsetHeight-mb))+'px'});
 ed.querySelectorAll('.memo').forEach(m=>{if(m!==editing)m.setAttribute('contenteditable','false')})}
/* 글자수 기록: 파일마다 '초기화'를 누른 때부터 셈(자정에 저절로 바뀌지 않음).
   초기화하면 그동안 쓴 양을 '시작한 날짜' 기록으로 저장 → 원고 폴더 daily_counts.json(+이 브라우저에도 사본)
   DC = { 파일명: { cur:{t:시작 시각(ms), ws:그때 공포, wos:그때 공미포}, days:[{d:'YYYY-MM-DD', ws:쓴 공포, wos:쓴 공미포}] } } */
const ymd=t=>{const n=new Date(t),p=x=>String(x).padStart(2,'0');return`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`};
let DC={};try{DC=JSON.parse(localStorage.getItem('tdtd_counts')||'{}')||{}}catch(e){}
try{const o=JSON.parse(localStorage.getItem('tdtd_daily')||'null');if(o){for(const k in o)if(!DC[k])DC[k]={cur:{t:Date.now(),ws:o[k].ws,wos:o[k].wos},days:[]};localStorage.removeItem('tdtd_daily')}}catch(e){}   // 예전 '오늘' 기준값 이어받기

/* EPUB 내보내기: 서식 없는 본문만(한 줄 = 한 문단, 메모 제외), 파일명·책 제목 = 파일 이름. 압축 없이 묶는 작은 zip 만들기(바깥 라이브러리 없이) */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipStore(files,type){const en=new TextEncoder(),P=[],C=[];let off=0;
 for(const[n,d]of files){const nb=en.encode(n),db=en.encode(d),c=crc32(db),h=new DataView(new ArrayBuffer(30)),e=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);
  e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(14,0x21,true);e.setUint32(16,c,true);e.setUint32(20,db.length,true);e.setUint32(24,db.length,true);e.setUint16(28,nb.length,true);e.setUint32(42,off,true);
  P.push(h,nb,db);C.push(e,nb);off+=30+nb.length+db.length}
 const cs=C.reduce((a,x)=>a+x.byteLength,0),z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cs,true);z.setUint32(16,off,true);
 return new Blob([...P,...C,z],{type})}
const xe=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function epubBlob(title,text){const id='urn:uuid:'+(crypto.randomUUID?crypto.randomUUID():Date.now()),mod=new Date().toISOString().replace(/\.\d+Z$/,'Z');
 const body=text.split('\n').map(l=>l.trim()?`<p>${xe(l)}</p>`:'<p>&#160;</p>').join('\n');
 const xh=(t,b,x='')=>`<?xml version="1.0" encoding="utf-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="ko" lang="ko"><head><meta charset="utf-8"/><title>${xe(t)}</title></head><body${x}>\n${b}\n</body></html>`;
 return zipStore([
  ['mimetype','application/epub+zip'],
  ['META-INF/container.xml','<?xml version="1.0" encoding="UTF-8"?>\n<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>'],
  ['OEBPS/content.opf',`<?xml version="1.0" encoding="UTF-8"?>\n<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bid" xml:lang="ko"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="bid">${id}</dc:identifier><dc:title>${xe(title)}</dc:title><dc:language>ko</dc:language><meta property="dcterms:modified">${mod}</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="text" href="text.xhtml" media-type="application/xhtml+xml"/></manifest><spine><itemref idref="text"/></spine></package>`],
  ['OEBPS/nav.xhtml',xh(title,`<nav epub:type="toc" hidden="hidden"><ol><li><a href="text.xhtml">${xe(title)}</a></li></ol></nav>`)],   // EPUB 규칙상 필요한 목차 파일(화면에는 안 나옴)
  ['OEBPS/text.xhtml',xh(title,body)]],'application/epub+zip')}
$('be').onclick=async()=>{const f=name+'.epub',b=epubBlob(name,plain(ed));
 if(dir)try{const h=await dir.getFileHandle(f,{create:true}),w=await h.createWritable();await w.write(b);await w.close();return say('EPUB 저장: '+f)}catch(e){}

/* ---------- 문단 잠금 / 메모 (우클릭) ---------- */
function ensure(){ // 에디터 직속 맨 텍스트를 <div>로 감싸 문단 단위로 다룸
 if(![...ed.childNodes].some(n=>n.nodeType===3&&n.nodeValue.trim()))return;
 const s=getSelection(),r=s.rangeCount?s.getRangeAt(0):null,sv=r&&[r.startContainer,r.startOffset,r.endContainer,r.endOffset];let run=[];
 const fl=()=>{if(run.some(n=>n.nodeType!==3||n.nodeValue.trim())){const d=document.createElement('div');run[0].before(d);d.append(...run)}run=[]};
 [...ed.childNodes].forEach(n=>{n.nodeType===1&&BLK.includes(n.tagName)?fl():run.push(n)});fl();
 if(sv)try{const q=document.createRange();q.setStart(sv[0],sv[1]);q.setEnd(sv[2],sv[3]);s.removeAllRanges();s.addRange(q)}catch(e){}}
/* 편집기는 항상 문단(div)을 하나 이상 가져요. 첫 줄이 '맨 글자'로 시작하면 서식(정렬·들여쓰기 등)이 안 붙고 한글 입력이 어긋나요(고질적인 첫 줄 문제의 원인) */
function seed(){
  if([...ed.children].some(c=>BLK.includes(c.tagName)))return;
  if([...ed.childNodes].some(n=>n.nodeType===3&&n.nodeValue.trim()))return ensure();   // 맨 글자가 있으면 문단으로 감싸요
  const d=document.createElement('div');d.append(document.createElement('br'));ed.replaceChildren(d);
  if(document.activeElement===ed){const s=getSelection(),r=document.createRange();r.setStart(d,0);r.collapse(true);s.removeAllRanges();s.addRange(r)}
}
ed.addEventListener('focus',()=>seed());
seed();ed.classList.toggle('blank',!ed.textContent.trim());
function selBlocks(){
 const s=getSelection();if(!s.rangeCount||s.isCollapsed)return[];const r=s.getRangeAt(0);if(!ed.contains(r.commonAncestorContainer))return[];
 const a=[...ed.children].filter(b=>BLK.includes(b.tagName)&&r.intersectsNode(b));
 if(a.length>1){const l=a[a.length-1],p=document.createRange();p.setStart(l,0);p.setEnd(r.endContainer,r.endOffset);if(l.contains(r.endContainer)&&!p.toString())a.pop()}
 return a}

 cm.style.display='block';cm.style.left=e.pageX+'px';cm.style.top=e.pageY+'px'});

function startEdit(x,y){if(!reading)return;reading=false;setEditable();
 ed.focus({preventScroll:true});const r=document.caretRangeFromPoint&&document.caretRangeFromPoint(x,y);
 if(r&&ed.contains(r.startContainer)){const s=getSelection();s.removeAllRanges();s.addRange(r)}}

 if(n-tapT<350&&Math.abs(t.clientX-tapX)<30&&Math.abs(t.clientY-tapY)<30){e.preventDefault();tapT=0;startEdit(t.clientX,t.clientY)}else{tapT=n;tapX=t.clientX;tapY=t.clientY}});
