<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 집필 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* 잠긴 영역: 조금 더 어두운 회색 음영 및 편집 차단 */
        .locked-span {
            background-color: #d1d5db;
            padding: 0.1rem 0.2rem;
            border-radius: 0.2rem;
            user-select: text;
        }
        /* 우클릭 커스텀 메뉴 스타일 */
        #context-menu {
            display: none;
            position: absolute;
            background: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 0.375rem;
            padding: 4px;
            z-index: 10000;
            font-size: 12px;
        }
        #context-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 6px 12px;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 0.25rem;
            color: #374151;
        }
        #context-menu button:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        /* 플레이스홀더 스타일 */
        #editor:empty:before {
            content: "여기에 글을 작성하세요...";
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }
        /* 폰트 스타일 */
        .font-sans-system { font-family: system-ui, -apple-system, sans-serif; }
        .font-gulim { font-family: 'Gulim', '굴림', sans-serif; }
        .font-dodum { font-family: 'Dodum', '돋움', sans-serif; }
        .font-batang { font-family: 'Batang', '바탕', serif; }

        /* 들여쓰기 (1em) */
        .indent-on p, .indent-on div {
            text-indent: 1em;
        }

        /* 줄간격 */
        .leading-tight-custom { line-height: 1.3; }
        .leading-normal-custom { line-height: 1.6; }
        .leading-loose-custom { line-height: 2.0; }

        /* 문단 간격 */
        .para-spacing-on p, .para-spacing-on div { margin-bottom: 1em; }
        .para-spacing-off p, .para-spacing-off div { margin-bottom: 0; }
    </style>
</head>
<body class="bg-white text-gray-900 h-screen flex flex-col m-0 overflow-hidden">

    <!-- 우클릭 커스텀 메뉴 -->
    <div id="context-menu">
        <button id="menu-unlock-btn">🔓 잠금 해제</button>
    </div>

    <!-- 1. 로그인 화면 -->
    <div id="auth-screen" class="fixed inset-0 bg-gray-50 flex items-center justify-center z-50">
        <div class="p-8 bg-white rounded-lg shadow-md w-96">
            <h2 class="mb-6 text-xl font-bold text-center text-gray-800">심플 집필 로그인</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="이메일" class="w-full p-2 mb-4 border rounded outline-none focus:border-blue-500" required>
                <input type="password" id="password" placeholder="비밀번호" class="w-full p-2 mb-4 border rounded outline-none focus:border-blue-500" required>
                <button type="submit" class="w-full py-2 text-white bg-blue-600 rounded hover:bg-blue-700 mb-4">로그인</button>
            </form>
            <div id="status-box" class="p-2 text-xs bg-gray-100 rounded text-gray-600 min-h-[30px] text-center">
                대기 중...
            </div>
        </div>
    </div>

    <!-- 2. 메인 집필 화면 -->
    <div id="app-screen" class="hidden flex flex-col h-full">
        <header class="flex items-center justify-between px-6 py-3 border-b border-gray-200 text-xs select-none bg-gray-50 flex-wrap gap-2 flex-shrink-0">
            <div class="flex items-center gap-2">
                <input type="text" id="file-name" value="untitled" class="border border-gray-300 rounded px-2 py-1 bg-white text-sm font-medium outline-none focus:border-blue-500 w-32" title="파일 이름 (.md 자동 적용)">
                <span class="text-gray-500 text-xs font-mono">.md</span>
                <button id="btn-new" class="px-2.5 py-1 bg-gray-200 hover:bg-gray-300 rounded font-medium text-gray-700">+ 새 파일</button>
                <button id="btn-save" class="px-2.5 py-1 bg-blue-600 text-white hover:bg-blue-700 rounded font-medium">수동저장</button>
                <span id="auto-save-status" class="text-gray-400 text-[11px] ml-1">자동저장 켜짐</span>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <select id="select-font" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="system">기본 고딕</option>
                    <option value="gulim">굴림체</option>
                    <option value="dodum">돋움체</option>
                    <option value="batang">바탕체</option>
                </select>

                <select id="select-align" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="justify">정렬: 양쪽</option>
                    <option value="left">정렬: 왼쪽</option>
                    <option value="center">정렬: 가운데</option>
                    <option value="right">정렬: 오른쪽</option>
                </select>

                <button id="btn-indent" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">들여쓰기: 끔</button>

                <select id="select-leading" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="normal">줄간격: 보통(1.6)</option>
                    <option value="tight">줄간격: 좁게(1.3)</option>
                    <option value="loose">줄간격: 넓게(2.0)</option>
                </select>

                <button id="btn-para" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">문단간격: 없음</button>
                <button id="btn-margin" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">여백: 있음</button>
                
                <button id="btn-lock" class="px-2 py-1 bg-amber-100 text-amber-800 hover:bg-amber-200 rounded font-medium">🔒 잠금</button>
                
                <button id="btn-logout" class="text-gray-500 hover:text-gray-800 ml-2">로그아웃</button>
            </div>
        </header>

        <main id="main-container" class="flex-1 overflow-y-auto w-full transition-all duration-300">
            <div id="content-wrapper" class="max-w-3xl mx-auto px-6 py-12 w-full min-h-full flex flex-col">
                <div id="editor" contenteditable="true" spellcheck="false" class="outline-none flex-1 font-sans-system leading-normal-custom para-spacing-off" style="text-align: justify;"></div>
            </div>
        </main>

        <!-- 박스 없이 깔끔한 회색 글씨 글자수 표시 -->
        <footer class="fixed bottom-3 right-6 text-gray-500 text-xs select-none z-50 pointer-events-none">
            공백 미포함 글자수: <span id="char-count">0</span>자
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://rtvvajhsnwkkrmncyfbs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';

        const statusBox = document.getElementById('status-box');
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const editor = document.getElementById('editor');
        const charCountSpan = document.getElementById('char-count');
        const fileNameInput = document.getElementById('file-name');
        const autoSaveStatus = document.getElementById('auto-save-status');
        const contentWrapper = document.getElementById('content-wrapper');
        const contextMenu = document.getElementById('context-menu');
        
        let appSupabase = null;
        let isWideMargin = true;
        let isIndentOn = false;
        let isParaOn = false;
        let autoSaveTimer = null;
        let currentLockedSpan = null;

        const SETTINGS_KEY = 'tdtd_app_settings';

        function saveSettings() {
            const settings = {
                font: document.getElementById('select-font').value,
                indent: isIndentOn,
                leading: document.getElementById('select-leading').value,
                para: isParaOn,
                margin: isWideMargin
            };
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        }

        function loadSettings() {
            const saved = localStorage.getItem(SETTINGS_KEY);
            if (!saved) return;
            try {
                const s = JSON.parse(saved);
                if (s.font) {
                    document.getElementById('select-font').value = s.font;
                    editor.classList.remove('font-sans-system', 'font-gulim', 'font-dodum', 'font-batang');
                    editor.classList.add('font-' + s.font);
                }
                if (s.indent !== undefined) {
                    isIndentOn = s.indent;
                    const btnIndent = document.getElementById('btn-indent');
                    if (isIndentOn) {
                        editor.classList.add('indent-on');
                        btnIndent.innerText = '들여쓰기: 켜짐';
                        btnIndent.classList.add('bg-blue-100', 'text-blue-800');
                    } else {
                        editor.classList.remove('indent-on');
                        btnIndent.innerText = '들여쓰기: 끔';
                        btnIndent.classList.remove('bg-blue-100', 'text-blue-800');
                    }
                }
                if (s.leading) {
                    document.getElementById('select-leading').value = s.leading;
                    editor.classList.remove('leading-tight-custom', 'leading-normal-custom', 'leading-loose-custom');
                    editor.classList.add('leading-' + s.leading + '-custom');
                }
                if (s.para !== undefined) {
                    isParaOn = s.para;
                    const btnPara = document.getElementById('btn-para');
                    if (isParaOn) {
                        editor.classList.remove('para-spacing-off');
                        editor.classList.add('para-spacing-on');
                        btnPara.innerText = '문단간격: 있음';
                        btnPara.classList.add('bg-blue-100', 'text-blue-800');
                    } else {
                        editor.classList.remove('para-spacing-on');
                        editor.classList.add('para-spacing-off');
                        btnPara.innerText = '문단간격: 없음';
                        btnPara.classList.remove('bg-blue-100', 'text-blue-800');
                    }
                }
                if (s.margin !== undefined) {
                    isWideMargin = s.margin;
                    const btnMargin = document.getElementById('btn-margin');
                    if (isWideMargin) {
                        contentWrapper.classList.add('max-w-3xl', 'px-6');
                        contentWrapper.classList.remove('px-16');
                        btnMargin.innerText = '여백: 있음';
                    } else {
                        contentWrapper.classList.remove('max-w-3xl', 'px-6');
                        contentWrapper.classList.add('px-16', 'w-full');
                        btnMargin.innerText = '여백: 없음';
                    }
                }
            } catch (e) {
                console.error('설정 불러오기 실패:', e);
            }
        }

        try {
            appSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            statusBox.innerText = '준비 완료';
        } catch (err) {
            statusBox.innerText = '초기화 에러: ' + err.message;
        }

        async function handleLoginSuccess() {
            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            loadSettings();
            await loadDocument();
        }

        async function checkUser() {
            if (!appSupabase) return;
            try {
                const { data: { session } } = await appSupabase.auth.getSession();
                if (session) await handleLoginSuccess();
            } catch (err) {
                console.error('세션 확인 에러:', err);
            }
        }
        checkUser();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!appSupabase) {
                alert('Supabase가 초기화되지 않았습니다.');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            statusBox.innerText = '로그인 시도 중...';

            try {
                const { data, error } = await appSupabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('로그인 실패: ' + error.message);
                    statusBox.innerText = error.message;
                } else {
                    await handleLoginSuccess();
                }
            } catch (err) {
                alert('예외 발생: ' + err.message);
                statusBox.innerText = '통신 에러 발생';
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            if (appSupabase) await appSupabase.auth.signOut();
            authScreen.classList.remove('hidden');
            appScreen.classList.add('hidden');
            statusBox.innerText = '대기 중...';
        });

        async function loadDocument() {
            if (!appSupabase) return;
            try {
                const { data: { session } } = await appSupabase.auth.getSession();
                if (!session) return;

                const rawName = fileNameInput.value.trim() || 'untitled';
                const title = rawName.endsWith('.md') ? rawName : rawName + '.md';

                const { data, error } = await appSupabase
                    .from('tdtd_manuscript')
                    .select('*')
                    .eq('user_id', session.user.id)
                    .eq('title', title)
                    .maybeSingle();

                if (data) {
                    editor.innerHTML = data.content || '';
                } else {
                    editor.innerHTML = '';
                }
                updateCharCount();
            } catch (err) {
                console.error('문서 불러오기 실패:', err);
            }
        }

        fileNameInput.addEventListener('change', loadDocument);

        document.getElementById('btn-new').addEventListener('click', () => {
            const newName = prompt("새 파일의 이름을 입력하세요 (예: chapter1):", `file_${Date.now()}`);
            if (!newName) return;
            fileNameInput.value = newName.trim().replace(/\.md$/, '');
            editor.innerHTML = '';
            updateCharCount();
        });

        function updateCharCount() {
            const text = editor.innerText || '';
            const cleanText = text.trim();
            if (!cleanText) {
                charCountSpan.innerText = '0';
                return;
            }
            charCountSpan.innerText = cleanText.replace(/\s/g, '').length;
        }

        async function executeSave(isManual = false) {
            if (!appSupabase) return;
            try {
                const { data: { session } } = await appSupabase.auth.getSession();
                if (!session) return;

                const rawName = fileNameInput.value.trim() || 'untitled';
                const title = rawName.endsWith('.md') ? rawName : rawName + '.md';
                const content = editor.innerHTML;

                const { data: existing } = await appSupabase
                    .from('tdtd_manuscript')
                    .select('id')
                    .eq('user_id', session.user.id)
                    .eq('title', title)
                    .maybeSingle();

                let error = null;
                if (existing) {
                    const res = await appSupabase
                        .from('tdtd_manuscript')
                        .update({ content })
                        .eq('id', existing.id);
                    error = res.error;
                } else {
                    const res = await appSupabase
                        .from('tdtd_manuscript')
                        .insert({ user_id: session.user.id, title, content });
                    error = res.error;
                }

                if (error) {
                    if (isManual) alert('저장 실패: ' + error.message);
                    autoSaveStatus.innerText = '저장 실패';
                } else {
                    if (isManual) alert('저장되었습니다.');
                    autoSaveStatus.innerText = '저장됨';
                    setTimeout(() => { autoSaveStatus.innerText = '자동저장 켜짐'; }, 2000);
                }
            } catch (err) {
                if (isManual) alert('저장 중 예외 발생: ' + err.message);
            }
        }

        editor.addEventListener('input', () => {
            updateCharCount();
            autoSaveStatus.innerText = '저장 중...';
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => { executeSave(false); }, 1000);
        });

        document.getElementById('btn-save').addEventListener('click', () => { executeSave(true); });

        // 외부 복사 시 불필요한 엔터 중복 방지 (HTML 구조를 분석하여 깨끗한 단일 줄바꿈 텍스트 추출)
        editor.addEventListener('copy', (e) => {
            const selection = window.getSelection();
            if (!selection.isCollapsed) {
                e.preventDefault();
                const range = selection.getRangeAt(0);
                const div = document.createElement('div');
                div.appendChild(range.cloneContents());

                function getCleanText(node) {
                    let result = '';
                    node.childNodes.forEach(child => {
                        if (child.nodeType === Node.TEXT_NODE) {
                            result += child.nodeValue;
                        } else if (child.nodeType === Node.ELEMENT_NODE) {
                            if (child.tagName === 'BR') {
                                result += '\n';
                            } else {
                                let inner = getCleanText(child);
                                if (['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI'].includes(child.tagName)) {
                                    if (inner.length > 0 && !inner.endsWith('\n')) {
                                        inner += '\n';
                                    }
                                }
                                result += inner;
                            }
                        }
                    });
                    return result;
                }

                let cleanText = getCleanText(div).replace(/\n{3,}/g, '\n\n').trim();
                e.clipboardData.setData('text/plain', cleanText);
            }
        });

        // 서식 옵션 제어 및 설정 저장
        document.getElementById('select-font').addEventListener('change', (e) => {
            editor.classList.remove('font-sans-system', 'font-gulim', 'font-dodum', 'font-batang');
            editor.classList.add('font-' + e.target.value);
            saveSettings();
        });

        document.getElementById('select-align').addEventListener('change', (e) => {
            const align = e.target.value;
            let command = 'justifyLeft';
            if (align === 'center') command = 'justifyCenter';
            else if (align === 'right') command = 'justifyRight';
            else if (align === 'justify') command = 'justifyFull';
            
            document.execCommand(command, false, null);
            editor.focus();
            executeSave(false);
        });

        const btnIndent = document.getElementById('btn-indent');
        btnIndent.addEventListener('click', () => {
            isIndentOn = !isIndentOn;
            if (isIndentOn) {
                editor.classList.add('indent-on');
                btnIndent.innerText = '들여쓰기: 켜짐';
                btnIndent.classList.add('bg-blue-100', 'text-blue-800');
            } else {
                editor.classList.remove('indent-on');
                btnIndent.innerText = '들여쓰기: 끔';
                btnIndent.classList.remove('bg-blue-100', 'text-blue-800');
            }
            saveSettings();
        });

        document.getElementById('select-leading').addEventListener('change', (e) => {
            editor.classList.remove('leading-tight-custom', 'leading-normal-custom', 'leading-loose-custom');
            editor.classList.add('leading-' + e.target.value + '-custom');
            saveSettings();
        });

        const btnPara = document.getElementById('btn-para');
        btnPara.addEventListener('click', () => {
            isParaOn = !isParaOn;
            if (isParaOn) {
                editor.classList.remove('para-spacing-off');
                editor.classList.add('para-spacing-on');
                btnPara.innerText = '문단간격: 있음';
                btnPara.classList.add('bg-blue-100', 'text-blue-800');
            } else {
                editor.classList.remove('para-spacing-on');
                editor.classList.add('para-spacing-off');
                btnPara.innerText = '문단간격: 없음';
                btnPara.classList.remove('bg-blue-100', 'text-blue-800');
            }
            saveSettings();
        });

        const btnMargin = document.getElementById('btn-margin');
        btnMargin.addEventListener('click', () => {
            isWideMargin = !isWideMargin;
            if (isWideMargin) {
                contentWrapper.classList.add('max-w-3xl', 'px-6');
                contentWrapper.classList.remove('px-16');
                btnMargin.innerText = '여백: 있음';
            } else {
                contentWrapper.classList.remove('max-w-3xl', 'px-6');
                contentWrapper.classList.add('px-16', 'w-full');
                btnMargin.innerText = '여백: 없음';
            }
            saveSettings();
        });

        // 잠금 처리 (contenteditable="false" 적용)
        document.getElementById('btn-lock').addEventListener('click', () => {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) {
                alert('잠글 영역을 드래그하여 선택해주세요.');
                return;
            }

            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.className = 'locked-span';
            span.setAttribute('contenteditable', 'false');
            span.appendChild(range.extractContents());
            range.insertNode(span);

            window.getSelection().removeAllRanges();
            updateCharCount();
            executeSave(false);
        });

        // 잠금 영역 우클릭 시 커스텀 메뉴 팝업 띄우기
        editor.addEventListener('contextmenu', (e) => {
            const lockedSpan = e.target.closest('.locked-span');
            if (lockedSpan) {
                e.preventDefault();
                currentLockedSpan = lockedSpan;
                
                contextMenu.style.display = 'block';
                contextMenu.style.left = e.pageX + 'px';
                contextMenu.style.top = e.pageY + 'px';
            } else {
                contextMenu.style.display = 'none';
            }
        });

        // 화면 다른 곳을 클릭하면 우클릭 메뉴 숨김
        window.addEventListener('click', () => {
            contextMenu.style.display = 'none';
        });

        // 우클릭 메뉴에서 '잠금 해제'를 눌렀을 때 실행
        document.getElementById('menu-unlock-btn').addEventListener('click', () => {
            if (currentLockedSpan && currentLockedSpan.parentNode) {
                const parent = currentLockedSpan.parentNode;
                while (currentLockedSpan.firstChild) {
                    parent.insertBefore(currentLockedSpan.firstChild, currentLockedSpan);
                }
                parent.removeChild(currentLockedSpan);
                updateCharCount();
                executeSave(false);
            }
            contextMenu.style.display = 'none';
            currentLockedSpan = null;
        });
    </script>
</body>
</html>
