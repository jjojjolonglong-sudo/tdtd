<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 집필 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: justify;
        }
        .locked-block {
            color: #9ca3af;
            user-select: none;
            background-color: #f3f4f6;
            padding: 0.1rem 0.2rem;
            border-radius: 0.25rem;
            display: inline-block;
        }
        /* 플레이스홀더 스타일 (입력이 없을 때만 표시) */
        #editor:empty:before {
            content: "여기에 글을 작성하세요...";
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }
    </style>
</head>
<body class="bg-white text-gray-900 h-screen flex flex-col m-0 overflow-hidden">

    <!-- 1. 로그인 화면 -->
    <div id="auth-screen" class="fixed inset-0 bg-gray-50 flex items-center justify-center z-50">
        <div class="p-8 bg-white rounded-lg shadow-md w-96">
            <h2 class="mb-6 text-xl font-bold text-center text-gray-800">심플 집필 로그인</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="이메일" class="w-full p-2 mb-4 border rounded outline-none focus:border-blue-500" required>
                <input type="password" id="password" placeholder="비밀번호" class="w-full p-2 mb-4 border rounded outline-none focus:border-blue-500" required>
                <button type="submit" class="w-full py-2 text-white bg-blue-600 rounded hover:bg-blue-700 mb-4">로그인</button>
            </form>
            <div id="status-box" class="p-2 text-xs bg-gray-100 rounded text-gray-600 min-h-[30px] text-center">
                대기 중...
            </div>
        </div>
    </div>

    <!-- 2. 메인 집필 화면 -->
    <div id="app-screen" class="hidden flex flex-col h-full">
        <header class="flex items-center justify-between px-6 py-3 border-b border-gray-200 text-sm select-none">
            <div class="flex items-center gap-4">
                <input type="text" id="file-name" value="untitled.md" class="border-b border-transparent hover:border-gray-300 focus:border-blue-500 outline-none px-1 font-medium">
                <button id="btn-save" class="px-3 py-1 bg-blue-600 text-white hover:bg-blue-700 rounded">저장</button>
            </div>
            <div class="flex items-center gap-4">
                <button id="btn-margin" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded">여백: 있음</button>
                <button id="btn-lock" class="px-3 py-1 bg-amber-100 text-amber-800 hover:bg-amber-200 rounded font-medium">🔒 선택 영역 잠금</button>
                <button id="btn-logout" class="text-gray-500 hover:text-gray-800">로그아웃</button>
            </div>
        </header>

        <main id="main-container" class="flex-1 overflow-y-auto px-6 py-12 transition-all duration-300 max-w-3xl mx-auto w-full">
            <div id="editor" contenteditable="true" class="outline-none min-h-full leading-relaxed" style="text-align: justify;"></div>
        </main>

        <footer class="fixed bottom-4 right-6 px-3 py-1 bg-gray-800 text-white text-xs rounded-full shadow-lg opacity-80 pointer-events-none select-none">
            공백 미포함 글자수: <span id="char-count">0</span>자
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://rtvvajhsnwkkrmncyfbs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0dnZhamhzbndra3JtbmN5ZmJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjkwMTEsImV4cCI6MjEwNzA0NTAxMX0.O2aLLeazv_FhUhbVAkp4vz3pw8GPb_683dUu7Et1Cwk';

        const statusBox = document.getElementById('status-box');
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const editor = document.getElementById('editor');
        const charCountSpan = document.getElementById('char-count');
        
        let appSupabase = null;
        let isWideMargin = true;

        try {
            appSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            statusBox.innerText = '준비 완료';
        } catch (err) {
            statusBox.innerText = '초기화 에러: ' + err.message;
        }

        // 로그인 성공 후 화면전환 및 문서 불러오기
        async function handleLoginSuccess() {
            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');
            await loadDocument();
        }

        // 초기 세션 확인
        async function checkUser() {
            if (!appSupabase) return;
            try {
                const { data: { session } } = await appSupabase.auth.getSession();
                if (session) {
                    await handleLoginSuccess();
                }
            } catch (err) {
                console.error('세션 확인 에러:', err);
            }
        }
        checkUser();

        // 로그인 처리
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!appSupabase) {
                alert('Supabase가 초기화되지 않았습니다.');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            statusBox.innerText = '로그인 시도 중...';

            try {
                const { data, error } = await appSupabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('로그인 실패: ' + error.message);
                    statusBox.innerText = error.message;
                } else {
                    await handleLoginSuccess();
                }
            } catch (err) {
                alert('예외 발생: ' + err.message);
                statusBox.innerText = '통신 에러 발생';
            }
        });

        // 로그아웃
        document.getElementById('btn-logout').addEventListener('click', async () => {
            if (appSupabase) await appSupabase.auth.signOut();
            authScreen.classList.remove('hidden');
            appScreen.classList.add('hidden');
            statusBox.innerText = '대기 중...';
        });

        // 문서 불러오기 (Supabase tdtd_manuscript 테이블 연동)
        async function loadDocument() {
            if (!appSupabase) return;
            try {
                const { data: { session } } = await appSupabase.auth.getSession();
                if (!session) return;

                const titleInput = document.getElementById('file-name');
                const title = titleInput.value.trim() || 'untitled.md';

                const { data, error } = await appSupabase
                    .from('tdtd_manuscript')
                    .select('*')
                    .eq('user_id', session.user.id)
                    .eq('title', title)
                    .maybeSingle();

                if (data) {
                    editor.innerHTML = data.content || '';
                } else {
                    editor.innerHTML = '';
                }
                updateCharCount();
            } catch (err) {
                console.error('문서 불러오기 실패:', err);
            }
        }

        // 파일 이름이 바뀔 때 해당 문서 로드 시도
        document.getElementById('file-name').addEventListener('change', loadDocument);

        // 글자수 계산 (비어있을 경우 0자 처리)
        function updateCharCount() {
            const text = editor.innerText || '';
            const cleanText = text.trim();
            if (!cleanText) {
                charCountSpan.innerText = '0';
                return;
            }
            charCountSpan.innerText = cleanText.replace(/\s/g, '').length;
        }
        editor.addEventListener('input', updateCharCount);
        updateCharCount();

        // 여백 모드 토글
        const mainContainer = document.getElementById('main-container');
        const btnMargin = document.getElementById('btn-margin');
        btnMargin.addEventListener('click', () => {
            isWideMargin = !isWideMargin;
            if (isWideMargin) {
                mainContainer.classList.add('max-w-3xl', 'mx-auto');
                btnMargin.innerText = '여백: 있음';
            } else {
                mainContainer.classList.remove('max-w-3xl', 'mx-auto');
                btnMargin.innerText = '여백: 없음';
            }
        });

        // Supabase에 파일 저장
        document.getElementById('btn-save').addEventListener('click', async () => {
            if (!appSupabase) {
                alert('Supabase가 연결되지 않았습니다.');
                return;
            }
            try {
                const { data: { session } } = await appSupabase.auth.getSession();
                if (!session) {
                    alert('로그인 세션이 만료되었습니다. 다시 로그인해주세요.');
                    return;
                }

                const title = document.getElementById('file-name').value.trim() || 'untitled.md';
                const content = editor.innerHTML;

                // 이미 해당 이름의 문서가 있는지 확인
                const { data: existing } = await appSupabase
                    .from('tdtd_manuscript')
                    .select('id')
                    .eq('user_id', session.user.id)
                    .eq('title', title)
                    .maybeSingle();

                let error = null;
                if (existing) {
                    // 수정
                    const res = await appSupabase
                        .from('tdtd_manuscript')
                        .update({ content })
                        .eq('id', existing.id);
                    error = res.error;
                } else {
                    // 새로 생성
                    const res = await appSupabase
                        .from('tdtd_manuscript')
                        .insert({ user_id: session.user.id, title, content });
                    error = res.error;
                }

                if (error) {
                    alert('저장 실패: ' + error.message);
                } else {
                    alert('Supabase에 안전하게 저장되었습니다.');
                }
            } catch (err) {
                alert('저장 중 예외 발생: ' + err.message);
            }
        });

        // 선택 영역 잠금
        document.getElementById('btn-lock').addEventListener('click', () => {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) {
                alert('잠글 영역을 드래그하여 선택해주세요.');
                return;
            }
            const range = selection.getRangeAt(0);
            const span = document.createElement('span');
            span.className = 'locked-block';
            span.setAttribute('contenteditable', 'false');
            span.textContent = range.toString();

            range.deleteContents();
            range.insertNode(span);
            updateCharCount();
        });
    </script>
</body>
</html>
