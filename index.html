<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 집필 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* 문단 잠금: 본문 위치 유지, 텍스트 뒤에 회색 배경음영 적용 */
        .locked-paragraph {
            background-color: #e5e7eb;
            padding: 2px 6px;
            border-radius: 4px;
            user-select: text;
        }
        
        /* 문단별 상대 좌표 설정 (메모 기준점) */
        #editor p, #editor div {
            position: relative;
        }

        /* 메모가 있는 문단에 충분한 최소 높이를 주어 겹침 및 여백 방지 */
        #editor p.has-memo, #editor div.has-memo {
            min-height: 4.5rem;
        }

        /* 우측 여백 메모 박스 (span 태그 기반, 300px 넉넉한 너비, 첫줄 나란히 정렬) */
        .para-memo {
            position: absolute;
            left: calc(100% + 1.5rem);
            top: 0;
            width: 300px;
            background-color: #f1f3f5;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            line-height: 1.4;
            border: none;
            outline: none;
            text-align: left;
            text-indent: 0 !important;
            z-index: 10;
            display: inline-block;
        }
        /* 문단 첫 줄과 메모를 잇는 연결선 */
        .para-memo::before {
            content: "";
            position: absolute;
            left: -1.5rem;
            top: 0.8em;
            width: 1.5rem;
            height: 1px;
            background-color: #cbd5e1;
        }

        /* 우클릭 커스텀 메뉴 스타일 */
        #context-menu, #title-context-menu {
            display: none;
            position: absolute;
            background: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 0.375rem;
            padding: 4px;
            z-index: 10000;
            font-size: 12px;
        }
        #context-menu button, #title-context-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 6px 12px;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 0.25rem;
            color: #374151;
        }
        #context-menu button:hover, #title-context-menu button:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        /* 플레이스홀더 스타일 */
        #editor:empty:before {
            content: "여기에 글을 작성하세요...";
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }
        /* 폰트 스타일 */
        .font-sans-system { font-family: system-ui, -apple-system, sans-serif; }
        .font-gulim { font-family: 'Gulim', '굴림', sans-serif; }
        .font-dodum { font-family: 'Dodum', '돋움', sans-serif; }
        .font-batang { font-family: 'Batang', '바탕', serif; }

        /* 들여쓰기 (1em) */
        .indent-on p, .indent-on div {
            text-indent: 1em;
        }

        /* 줄간격 */
        .leading-tight-custom { line-height: 1.3; }
        .leading-normal-custom { line-height: 1.6; }
        .leading-loose-custom { line-height: 2.0; }

        /* 문단 간격 */
        .para-spacing-on > p, .para-spacing-on > div { margin-bottom: 1em; }
        .para-spacing-off > p, .para-spacing-off > div { margin-bottom: 0; }
    </style>
</head>
<body class="bg-white text-gray-900 h-screen flex flex-col m-0 overflow-hidden">

    <!-- 우클릭 커스텀 메뉴 (문단 잠금 및 메모 관리용) -->
    <div id="context-menu">
        <button id="menu-lock-toggle-btn">🔒 문단 잠금</button>
        <button id="menu-memo-toggle-btn">📝 메모 추가</button>
    </div>

    <!-- 파일 제목 우클릭 메뉴 -->
    <div id="title-context-menu">
        <button id="menu-edit-title-btn">✏️ 이름 수정</button>
    </div>

    <div id="app-screen" class="flex flex-col h-full">
        <header class="flex items-center justify-between px-6 py-3 border-b border-gray-200 text-xs select-none bg-gray-50 flex-wrap gap-2 flex-shrink-0">
            <div class="flex items-center gap-2">
                <button id="btn-folder" class="px-2.5 py-1 bg-gray-200 hover:bg-gray-300 rounded font-medium text-gray-700">저장 폴더 지정</button>
                
                <!-- 파일 불러오기 드롭다운 -->
                <select id="file-select" class="border border-gray-300 rounded px-2 py-1 bg-white text-xs outline-none focus:border-blue-500 w-32" title="저장된 파일 불러오기">
                    <option value="">파일 목록</option>
                </select>

                <!-- 파일 이름 영역 (.md 감추기 및 우클릭 수정 지원) -->
                <div id="file-title-wrapper" class="relative flex items-center">
                    <span id="file-title-display" class="border border-transparent hover:border-gray-300 rounded px-2 py-1 bg-transparent text-sm font-medium cursor-pointer" title="우클릭하여 이름 수정">untitled</span>
                    <input type="text" id="file-name" value="untitled" class="border border-gray-300 rounded px-2 py-1 bg-white text-sm font-medium outline-none focus:border-blue-500 w-28 hidden" title="파일 이름">
                </div>

                <button id="btn-save" class="px-2.5 py-1 bg-blue-600 text-white hover:bg-blue-700 rounded font-medium">수동저장</button>
                <button id="btn-export-txt" class="px-2.5 py-1 bg-emerald-600 text-white hover:bg-emerald-700 rounded font-medium">TXT 내보내기</button>
                <span id="auto-save-status" class="text-gray-400 text-[11px] ml-1">폴더 미지정</span>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <select id="select-font" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="system">기본 고딕</option>
                    <option value="gulim">굴림체</option>
                    <option value="dodum">돋움체</option>
                    <option value="batang">바탕체</option>
                </select>

                <select id="select-align" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="justify">정렬: 양쪽</option>
                    <option value="left">정렬: 왼쪽</option>
                    <option value="center">정렬: 가운데</option>
                    <option value="right">정렬: 오른쪽</option>
                </select>

                <button id="btn-indent" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">들여쓰기: 끔</button>

                <select id="select-leading" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="normal">줄간격: 보통(1.6)</option>
                    <option value="tight">줄간격: 좁게(1.3)</option>
                    <option value="loose">줄간격: 넓게(2.0)</option>
                </select>

                <button id="btn-para" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">문단간격: 없음</button>
                <button id="btn-margin" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">여백: 중간</button>
                
                <button id="btn-lock" class="px-2 py-1 bg-amber-100 text-amber-800 hover:bg-amber-200 rounded font-medium">🔒 문단 잠금</button>
                <button id="btn-unlock-all" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 font-medium">🔓 전체 잠금 해제</button>
            </div>
        </header>

        <!-- 본문 영역 스크롤바 -->
        <main id="main-container" class="flex-1 overflow-y-auto w-full transition-all duration-300">
            <div id="content-wrapper" class="max-w-3xl mx-auto px-6 py-12 w-full min-h-full flex flex-col">
                <div id="editor" contenteditable="true" spellcheck="false" class="outline-none flex-1 font-sans-system leading-normal-custom para-spacing-off" style="text-align: justify; padding-bottom: 50vh;"></div>
            </div>
        </main>

        <!-- 하단 글자수 표기 바 (고정형) -->
        <footer class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-sm border-t border-gray-200 py-2 px-6 text-gray-500 text-xs select-none z-40 flex justify-end">
            <span id="char-count">글자수 0 (0)</span>
        </footer>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const charCountSpan = document.getElementById('char-count');
        const fileNameInput = document.getElementById('file-name');
        const fileTitleDisplay = document.getElementById('file-title-display');
        const fileTitleWrapper = document.getElementById('file-title-wrapper');
        const titleContextMenu = document.getElementById('title-context-menu');
        const fileSelect = document.getElementById('file-select');
        const autoSaveStatus = document.getElementById('auto-save-status');
        const contentWrapper = document.getElementById('content-wrapper');
        const contextMenu = document.getElementById('context-menu');
        const btnFolder = document.getElementById('btn-folder');
        const mainContainer = document.getElementById('main-container');
        
        let dirHandle = null;
        let marginMode = 2; // 0: 없음, 1: 좁음, 2: 중간, 3: 넓음
        let isIndentOn = false;
        let isParaOn = false;
        let autoSaveTimer = null;
        let currentBlock = null;

        // IndexedDB를 이용한 디렉토리 핸들 저장/조회
        const DB_NAME = 'TdtdAppDB';
        const STORE_NAME = 'handles';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveHandleToDB(handle) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(handle, 'savedDirHandle');
                return new Promise((resolve, reject) => {
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                console.error('핸들 DB 저장 실패:', e);
            }
        }

        async function getHandleFromDB() {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const request = tx.objectStore(STORE_NAME).get('savedDirHandle');
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (e) {
                return null;
            }
        }

        // 앱 시작 시 이전 폴더 핸들 복구 시도
        window.addEventListener('DOMContentLoaded', async () => {
            await loadSettings();
            const savedHandle = await getHandleFromDB();
            if (savedHandle) {
                if ((await savedHandle.queryPermission({ mode: 'readwrite' })) === 'granted') {
                    dirHandle = savedHandle;
                    autoSaveStatus.innerText = '자동저장 켜짐';
                    btnFolder.innerText = '폴더 연결됨';
                    btnFolder.classList.add('bg-blue-100', 'text-blue-800');
                    await loadFileList();
                } else {
                    dirHandle = savedHandle;
                    autoSaveStatus.innerText = '클릭하여 폴더 권한 허용';
                    btnFolder.innerText = '폴더 권한 재확인';
                    btnFolder.classList.add('bg-amber-100', 'text-amber-800');
                }
            }
        });

        // 지정 폴더 내 settings.json에 설정 저장
        async function saveSettings() {
            const settings = {
                font: document.getElementById('select-font').value,
                indent: isIndentOn,
                leading: document.getElementById('select-leading').value,
                para: isParaOn,
                margin: marginMode
            };
            
            localStorage.setItem('tdtd_app_settings', JSON.stringify(settings));

            if (dirHandle) {
                try {
                    const fileHandle = await dirHandle.getFileHandle('settings.json', { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(JSON.stringify(settings));
                    await writable.close();
                } catch (e) {
                    console.error('설정 파일 저장 실패:', e);
                }
            }
        }

        async function loadSettings() {
            let loadedSettings = null;
            if (dirHandle) {
                try {
                    const fileHandle = await dirHandle.getFileHandle('settings.json');
                    const file = await fileHandle.getFile();
                    loadedSettings = JSON.parse(await file.text());
                } catch (e) {}
            }
            if (!loadedSettings) {
                const saved = localStorage.getItem('tdtd_app_settings');
                if (saved) loadedSettings = JSON.parse(saved);
            }

            if (!loadedSettings) return;

            try {
                const s = loadedSettings;
                if (s.font) {
                    document.getElementById('select-font').value = s.font;
                    editor.classList.remove('font-sans-system', 'font-gulim', 'font-dodum', 'font-batang');
                    editor.classList.add('font-' + s.font);
                }
                if (s.indent !== undefined) {
                    isIndentOn = s.indent;
                    const btnIndent = document.getElementById('btn-indent');
                    if (isIndentOn) {
                        editor.classList.add('indent-on');
                        btnIndent.innerText = '들여쓰기: 켜짐';
                        btnIndent.classList.add('bg-blue-100', 'text-blue-800');
                    } else {
                        editor.classList.remove('indent-on');
                        btnIndent.innerText = '들여쓰기: 끔';
                        btnIndent.classList.remove('bg-blue-100', 'text-blue-800');
                    }
                }
                if (s.leading) {
                    document.getElementById('select-leading').value = s.leading;
                    editor.classList.remove('leading-tight-custom', 'leading-normal-custom', 'leading-loose-custom');
                    editor.classList.add('leading-' + s.leading + '-custom');
                }
                if (s.para !== undefined) {
                    isParaOn = s.para;
                    const btnPara = document.getElementById('btn-para');
                    if (isParaOn) {
                        editor.classList.remove('para-spacing-off');
                        editor.classList.add('para-spacing-on');
                        btnPara.innerText = '문단간격: 있음';
                        btnPara.classList.add('bg-blue-100', 'text-blue-800');
                    } else {
                        editor.classList.remove('para-spacing-on');
                        editor.classList.add('para-spacing-off');
                        btnPara.innerText = '문단간격: 없음';
                        btnPara.classList.remove('bg-blue-100', 'text-blue-800');
                    }
                }
                if (s.margin !== undefined) {
                    marginMode = s.margin;
                    applyMarginMode();
                }
            } catch (e) {
                console.error('설정 적용 실패:', e);
            }
        }

        function applyMarginMode() {
            const btnMargin = document.getElementById('btn-margin');
            contentWrapper.className = 'w-full min-h-full flex flex-col mx-auto transition-all duration-300';
            
            if (marginMode === 0) { // 없음
                contentWrapper.classList.add('max-w-none', 'px-6');
                btnMargin.innerText = '여백: 없음';
            } else if (marginMode === 1) { // 좁음
                contentWrapper.classList.add('max-w-5xl', 'px-8');
                btnMargin.innerText = '여백: 좁음';
            } else if (marginMode === 2) { // 중간
                contentWrapper.classList.add('max-w-3xl', 'px-6');
                btnMargin.innerText = '여백: 중간';
            } else if (marginMode === 3) { // 넓음
                contentWrapper.classList.add('max-w-xl', 'px-6');
                btnMargin.innerText = '여백: 넓음';
            }
        }

        // 여백 버튼 클릭 시 4가지 모드 순환
        document.getElementById('btn-margin').addEventListener('click', () => {
            marginMode = (marginMode + 1) % 4;
            applyMarginMode();
            saveSettings();
        });

        // 폴더 지정 버튼
        btnFolder.addEventListener('click', async () => {
            try {
                if (dirHandle) {
                    const permission = await dirHandle.requestPermission({ mode: 'readwrite' });
                    if (permission === 'granted') {
                        autoSaveStatus.innerText = '자동저장 켜짐';
                        btnFolder.innerText = '폴더 연결됨';
                        btnFolder.classList.remove('bg-amber-100', 'text-amber-800');
                        btnFolder.classList.add('bg-blue-100', 'text-blue-800');
                        await loadFileList();
                        await loadSettings();
                        return;
                    }
                }
                dirHandle = await window.showDirectoryPicker();
                await saveHandleToDB(dirHandle);
                autoSaveStatus.innerText = '자동저장 켜짐';
                btnFolder.innerText = '폴더 연결됨';
                btnFolder.classList.remove('bg-amber-100', 'text-amber-800');
                btnFolder.classList.add('bg-blue-100', 'text-blue-800');
                alert('저장 폴더가 지정되었습니다.');
                await loadFileList();
                await loadSettings();
            } catch (err) {
                console.error(err);
            }
        });

        // 파일 목록 불러오기
        async function loadFileList() {
            if (!dirHandle) return;
            fileSelect.innerHTML = '<option value="">파일 목록</option>';
            
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && entry.name.endsWith('.md')) {
                    const opt = document.createElement('option');
                    opt.value = entry.name;
                    opt.textContent = entry.name.replace(/\.md$/, '');
                    fileSelect.appendChild(opt);
                }
            }
        }

        // 드롭다운에서 기존 파일 선택 시 불러오기
        fileSelect.addEventListener('change', async (e) => {
            const val = e.target.value;
            if (!val || !dirHandle) return;

            const fullName = val.endsWith('.md') ? val : val + '.md';
            try {
                const fileHandle = await dirHandle.getFileHandle(fullName);
                const file = await fileHandle.getFile();
                const text = await file.text();
                editor.innerHTML = text;
                const cleanName = val.replace(/\.md$/, '');
                fileNameInput.value = cleanName;
                fileTitleDisplay.innerText = cleanName;
                updateCharCount();
            } catch (err) {
                alert('파일 읽기 실패: ' + err.message);
            }
        });

        // 글자수 표기 (메모 영역 제외하고 본문 텍스트만 계산)
        function updateCharCount() {
            const clone = editor.cloneNode(true);
            clone.querySelectorAll('.para-memo').forEach(m => m.remove());
            const text = clone.innerText || '';
            const cleanText = text.trim();
            const withSpaces = cleanText.length;
            const withoutSpaces = cleanText.replace(/\s/g, '').length;
            charCountSpan.innerText = `글자수 ${withSpaces.toLocaleString()} (${withoutSpaces.toLocaleString()})`;
        }

        // 커서 위치가 화면 하단에 가려지지 않도록 스크롤 자동 보정 (5줄 여유 유지)
        function ensureCursorVisible() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            
            let rect = range.getBoundingClientRect();
            if (rect.top === 0 && rect.bottom === 0) {
                const span = document.createElement('span');
                span.textContent = '\u200b';
                range.insertNode(span);
                rect = span.getBoundingClientRect();
                span.remove();
            }

            const containerRect = mainContainer.getBoundingClientRect();
            const bottomThreshold = containerRect.bottom - 150;

            if (rect.bottom > bottomThreshold) {
                mainContainer.scrollTop += (rect.bottom - bottomThreshold);
            }
        }

        // 자동 저장
        async function executeAutoSave() {
            if (!dirHandle) return;
            const rawName = fileNameInput.value.trim() || 'untitled';
            const title = rawName.endsWith('.md') ? rawName : rawName + '.md';

            try {
                const fileHandle = await dirHandle.getFileHandle(title, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(editor.innerHTML);
                await writable.close();
                autoSaveStatus.innerText = '저장됨';
                setTimeout(() => { autoSaveStatus.innerText = '자동저장 켜짐'; }, 2000);
            } catch (err) {
                autoSaveStatus.innerText = '저장 실패';
            }
        }

        editor.addEventListener('input', () => {
            updateCharCount();
            ensureCursorVisible();
            autoSaveStatus.innerText = '저장 중...';
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => { executeAutoSave(); }, 1000);
        });

        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                setTimeout(ensureCursorVisible, 10);
            }

            // 메모 박스 내부에서 Ctrl+A를 누를 경우 해당 메모박스 안의 텍스트만 선택되도록 처리
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    let node = selection.anchorNode;
                    let memoBox = node.nodeType === Node.TEXT_NODE ? node.parentElement.closest('.para-memo') : node.closest('.para-memo');
                    if (memoBox) {
                        e.preventDefault(); // 전체 에디터가 선택되는 기본 동작 방지
                        const range = document.createRange();
                        range.selectNodeContents(memoBox);
                        selection.removeAllRanges();
                        selection.addRange(range);
                    }
                }
            }
        });

        // 파일 제목 수정 후 엔터 시 고정 모드 전환
        fileNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                commitTitleEdit();
            }
        });

        fileNameInput.addEventListener('blur', () => {
            commitTitleEdit();
        });

        function commitTitleEdit() {
            let val = fileNameInput.value.trim() || 'untitled';
            val = val.replace(/\.md$/, '');
            fileNameInput.value = val;
            fileTitleDisplay.innerText = val;
            fileNameInput.classList.add('hidden');
            fileTitleDisplay.classList.remove('hidden');
            executeAutoSave();
            loadFileList();
        }

        // 파일 제목 영역 우클릭 메뉴 처리
        fileTitleDisplay.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            titleContextMenu.style.display = 'block';
            titleContextMenu.style.left = e.pageX + 'px';
            titleContextMenu.style.top = e.pageY + 'px';
        });

        document.getElementById('menu-edit-title-btn').addEventListener('click', () => {
            titleContextMenu.style.display = 'none';
            fileTitleDisplay.classList.add('hidden');
            fileNameInput.classList.remove('hidden');
            fileNameInput.focus();
            fileNameInput.select();
        });

        // 수동 저장 버튼
        document.getElementById('btn-save').addEventListener('click', async () => {
            if (!dirHandle) {
                alert('먼저 "저장 폴더 지정" 버튼을 눌러주세요.');
                return;
            }
            await executeAutoSave();
            await loadFileList();
            alert('저장되었습니다.');
        });

        // TXT 내보내기 버튼 (메모 제외 및 줄바꿈 유지)
        document.getElementById('btn-export-txt').addEventListener('click', async () => {
            const rawName = fileNameInput.value.trim() || 'untitled';
            const fileName = rawName.replace(/\.md$/, '') + '.txt';

            const div = document.createElement('div');
            div.innerHTML = editor.innerHTML;
            div.querySelectorAll('.para-memo').forEach(m => m.remove());

            function getCleanText(node) {
                let result = '';
                node.childNodes.forEach(child => {
                    if (child.nodeType === Node.TEXT_NODE) {
                        result += child.nodeValue;
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        if (child.tagName === 'BR') {
                            result += '\n';
                        } else {
                            let inner = getCleanText(child);
                            if (['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI'].includes(child.tagName)) {
                                if (inner.length > 0 && !inner.endsWith('\n')) {
                                    inner += '\n';
                                }
                            }
                            result += inner;
                        }
                    }
                });
                return result;
            }

            let cleanText = getCleanText(div).replace(/\n{3,}/g, '\n\n').trim();

            if (dirHandle) {
                try {
                    const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(cleanText);
                    await writable.close();
                    alert(`연결된 폴더에 TXT 파일이 저장되었습니다:\n${fileName}`);
                    return;
                } catch (err) {
                    console.error('폴더 내 TXT 저장 실패:', err);
                }
            }

            const blob = new Blob([cleanText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // 외부 복사 시 줄바꿈 최적화
        editor.addEventListener('copy', (e) => {
            const selection = window.getSelection();
            if (!selection.isCollapsed) {
                e.preventDefault();
                const range = selection.getRangeAt(0);
                const div = document.createElement('div');
                div.appendChild(range.cloneContents());
                div.querySelectorAll('.para-memo').forEach(m => m.remove());

                function getCleanText(node) {
                    let result = '';
                    node.childNodes.forEach(child => {
                        if (child.nodeType === Node.TEXT_NODE) {
                            result += child.nodeValue;
                        } else if (child.nodeType === Node.ELEMENT_NODE) {
                            if (child.tagName === 'BR') {
                                result += '\n';
                            } else {
                                let inner = getCleanText(child);
                                if (['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI'].includes(child.tagName)) {
                                    if (inner.length > 0 && !inner.endsWith('\n')) {
                                        inner += '\n';
                                    }
                                }
                                result += inner;
                            }
                        }
                    });
                    return result;
                }

                let cleanText = getCleanText(div).replace(/\n{3,}/g, '\n\n').trim();
                e.clipboardData.setData('text/plain', cleanText);
            }
        });

        // 서식 제어 및 설정 저장 연동
        document.getElementById('select-font').addEventListener('change', (e) => {
            editor.classList.remove('font-sans-system', 'font-gulim', 'font-dodum', 'font-batang');
            editor.classList.add('font-' + e.target.value);
            saveSettings();
        });

        document.getElementById('select-align').addEventListener('change', (e) => {
            const align = e.target.value;
            let command = 'justifyLeft';
            if (align === 'center') command = 'justifyCenter';
            else if (align === 'right') command = 'justifyRight';
            else if (align === 'justify') command = 'justifyFull';
            
            document.execCommand(command, false, null);
            editor.focus();
            executeAutoSave();
        });

        const btnIndent = document.getElementById('btn-indent');
        btnIndent.addEventListener('click', () => {
            isIndentOn = !isIndentOn;
            if (isIndentOn) {
                editor.classList.add('indent-on');
                btnIndent.innerText = '들여쓰기: 켜짐';
                btnIndent.classList.add('bg-blue-100', 'text-blue-800');
            } else {
                editor.classList.remove('indent-on');
                btnIndent.innerText = '들여쓰기: 끔';
                btnIndent.classList.remove('bg-blue-100', 'text-blue-800');
            }
            saveSettings();
        });

        document.getElementById('select-leading').addEventListener('change', (e) => {
            editor.classList.remove('leading-tight-custom', 'leading-normal-custom', 'leading-loose-custom');
            editor.classList.add('leading-' + e.target.value + '-custom');
            saveSettings();
        });

        const btnPara = document.getElementById('btn-para');
        btnPara.addEventListener('click', () => {
            isParaOn = !isParaOn;
            if (isParaOn) {
                editor.classList.remove('para-spacing-off');
                editor.classList.add('para-spacing-on');
                btnPara.innerText = '문단간격: 있음';
                btnPara.classList.add('bg-blue-100', 'text-blue-800');
            } else {
                editor.classList.remove('para-spacing-on');
                editor.classList.add('para-spacing-off');
                btnPara.innerText = '문단간격: 없음';
                btnPara.classList.remove('bg-blue-100', 'text-blue-800');
            }
            saveSettings();
        });

        // 헬퍼: 노드가 속한 문단 블록 찾기
        function getParentBlock(node) {
            if (!node) return null;
            let block = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
            while (block && block.parentElement !== editor && block !== editor) {
                block = block.parentElement;
            }
            return (block && block !== editor && editor.contains(block)) ? block : null;
        }

        // 선택 영역 정밀 보정 헬퍼 (더블클릭/삼중클릭 시 다음 문단 시작점으로 오버플로우되는 현상 방지)
        function getNormalizedSelectionRange() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return null;
            let range = selection.getRangeAt(0).cloneRange();

            if (range.endOffset === 0 && !range.collapsed) {
                let container = range.endContainer;
                try {
                    if (container.nodeType === Node.TEXT_NODE) {
                        if (container.previousSibling) {
                            range.setEndAfter(container.previousSibling);
                        } else if (container.parentNode && container.parentNode !== editor) {
                            range.setEndBefore(container.parentNode);
                        }
                    } else if (container.nodeType === Node.ELEMENT_NODE) {
                        let prev = container.previousElementSibling || container.previousSibling;
                        if (prev) {
                            range.setEndAfter(prev);
                        }
                    }
                } catch (e) {}
            }
            return range;
        }

        // 문단 단위 잠금 처리 (드래그 포함 영역 전체 잠금 + 오버플로우 버그 해결)
        document.getElementById('btn-lock').addEventListener('click', () => {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) {
                alert('잠글 문단 영역을 드래그하거나 선택해주세요.');
                return;
            }

            const range = getNormalizedSelectionRange();
            if (!range) return;

            let targetBlocks = new Set();
            
            let blocks = Array.from(editor.querySelectorAll(':scope > p, :scope > div'));
            if (blocks.length === 0) {
                if (editor.innerHTML.trim() !== '') {
                    editor.innerHTML = `<div>${editor.innerHTML}</div>`;
                    blocks = Array.from(editor.querySelectorAll(':scope > p, :scope > div'));
                }
            }

            let anchorBlock = getParentBlock(selection.anchorNode);
            let focusBlock = getParentBlock(selection.focusNode);
            if (anchorBlock && focusBlock && anchorBlock === focusBlock) {
                targetBlocks.add(anchorBlock);
            } else {
                blocks.forEach(block => {
                    const blockRange = document.createRange();
                    blockRange.selectNodeContents(block);
                    
                    const startsBeforeEnd = range.compareBoundaryPoints(Range.START_TO_END, blockRange) > 0;
                    const endsAfterStart = range.compareBoundaryPoints(Range.END_TO_START, blockRange) < 0;
                    
                    if (startsBeforeEnd && endsAfterStart) {
                        if (range.endContainer === block && range.endOffset === 0) return;
                        if (range.endContainer.nodeType === Node.TEXT_NODE && range.endContainer.parentNode === block && range.endOffset === 0) return;
                        
                        targetBlocks.add(block);
                    }
                });
            }

            if (targetBlocks.size === 0 && anchorBlock) {
                targetBlocks.add(anchorBlock);
            }

            targetBlocks.forEach(block => {
                if (block !== editor) {
                    block.setAttribute('contenteditable', 'false');
                    block.classList.add('locked-paragraph');
                }
            });

            window.getSelection().removeAllRanges();
            updateCharCount();
            executeAutoSave();
        });

        // 문단 잠금 일괄 해제 버튼
        document.getElementById('btn-unlock-all').addEventListener('click', () => {
            const lockedBlocks = editor.querySelectorAll('.locked-paragraph, [contenteditable="false"]');
            if (lockedBlocks.length === 0) {
                alert('잠긴 문단이 없습니다.');
                return;
            }
            lockedBlocks.forEach(block => {
                if (block.classList.contains('para-memo')) return;
                block.removeAttribute('contenteditable');
                block.classList.remove('locked-paragraph');
            });
            updateCharCount();
            executeAutoSave();
            alert('모든 문단 잠금이 해제되었습니다.');
        });

        // 우클릭 시 컨텍스트 메뉴 표시 (잠금/해제 및 메모 추가/삭제)
        editor.addEventListener('contextmenu', (e) => {
            const block = getParentBlock(e.target);
            if (block && !e.target.classList.contains('para-memo')) {
                e.preventDefault();
                currentBlock = block;
                
                const isLocked = block.classList.contains('locked-paragraph') || block.getAttribute('contenteditable') === 'false';
                const hasMemo = block.querySelector('.para-memo') !== null;

                document.getElementById('menu-lock-toggle-btn').innerText = isLocked ? '🔓 잠금 해제' : '🔒 문단 잠금';
                document.getElementById('menu-memo-toggle-btn').innerText = hasMemo ? '🗑️ 메모 삭제' : '📝 메모 추가';
                
                contextMenu.style.display = 'block';
                contextMenu.style.left = e.pageX + 'px';
                contextMenu.style.top = e.pageY + 'px';
            } else {
                contextMenu.style.display = 'none';
            }
        });

        // 전역 클릭 시 커서 메뉴 닫기
        window.addEventListener('click', () => {
            contextMenu.style.display = 'none';
            titleContextMenu.style.display = 'none';
        });

        // 우클릭 메뉴: 잠금/해제 토글
        document.getElementById('menu-lock-toggle-btn').addEventListener('click', () => {
            if (currentBlock) {
                const isLocked = currentBlock.classList.contains('locked-paragraph') || currentBlock.getAttribute('contenteditable') === 'false';
                
                if (isLocked) {
                    currentBlock.removeAttribute('contenteditable');
                    currentBlock.classList.remove('locked-paragraph');
                } else {
                    currentBlock.setAttribute('contenteditable', 'false');
                    currentBlock.classList.add('locked-paragraph');
                }
                updateCharCount();
                executeAutoSave();
            }
            contextMenu.style.display = 'none';
            currentBlock = null;
        });

        // 우클릭 메뉴: 메모 추가/삭제 토글 (span 태그 기반, 자동 커서 포커스 및 .has-memo 여백 관리)
        document.getElementById('menu-memo-toggle-btn').addEventListener('click', () => {
            if (currentBlock) {
                const existingMemo = currentBlock.querySelector('.para-memo');
                if (existingMemo) {
                    existingMemo.remove();
                    currentBlock.classList.remove('has-memo');
                } else {
                    const memoSpan = document.createElement('span');
                    memoSpan.className = 'para-memo';
                    memoSpan.setAttribute('contenteditable', 'true');
                    memoSpan.setAttribute('spellcheck', 'false');
                    currentBlock.appendChild(memoSpan);
                    currentBlock.classList.add('has-memo');
                    memoSpan.focus();
                }
                updateCharCount();
                executeAutoSave();
            }
            contextMenu.style.display = 'none';
            currentBlock = null;
        });
    </script>
</body>
</html>
