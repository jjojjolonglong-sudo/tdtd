<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 집필 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* 문단 잠금: 문단 자체 배경은 없고, 앞뒤로 양옆이 짧게 잘린 회색 음영 줄 생성 */
        .locked-paragraph {
            position: relative;
            user-select: text;
        }
        .locked-paragraph::before,
        .locked-paragraph::after {
            content: "";
            display: block;
            height: 6px;
            background-color: #d1d5db;
            margin: 6px 3rem;
            border-radius: 2px;
        }
        /* 우클릭 커스텀 메뉴 스타일 */
        #context-menu {
            display: none;
            position: absolute;
            background: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 0.375rem;
            padding: 4px;
            z-index: 10000;
            font-size: 12px;
        }
        #context-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 6px 12px;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 0.25rem;
            color: #374151;
        }
        #context-menu button:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        /* 플레이스홀더 스타일 */
        #editor:empty:before {
            content: "여기에 글을 작성하세요...";
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }
        /* 폰트 스타일 */
        .font-sans-system { font-family: system-ui, -apple-system, sans-serif; }
        .font-gulim { font-family: 'Gulim', '굴림', sans-serif; }
        .font-dodum { font-family: 'Dodum', '돋움', sans-serif; }
        .font-batang { font-family: 'Batang', '바탕', serif; }

        /* 들여쓰기 (1em) */
        .indent-on p, .indent-on div {
            text-indent: 1em;
        }

        /* 줄간격 */
        .leading-tight-custom { line-height: 1.3; }
        .leading-normal-custom { line-height: 1.6; }
        .leading-loose-custom { line-height: 2.0; }

        /* 문단 간격 */
        .para-spacing-on p, .para-spacing-on div { margin-bottom: 1em; }
        .para-spacing-off p, .para-spacing-off div { margin-bottom: 0; }
    </style>
</head>
<body class="bg-white text-gray-900 h-screen flex flex-col m-0 overflow-hidden">

    <!-- 우클릭 커스텀 메뉴 -->
    <div id="context-menu">
        <button id="menu-unlock-btn">🔓 잠금 해제</button>
    </div>

    <div id="app-screen" class="flex flex-col h-full">
        <header class="flex items-center justify-between px-6 py-3 border-b border-gray-200 text-xs select-none bg-gray-50 flex-wrap gap-2 flex-shrink-0">
            <div class="flex items-center gap-2">
                <button id="btn-folder" class="px-2.5 py-1 bg-gray-200 hover:bg-gray-300 rounded font-medium text-gray-700">저장 폴더 지정</button>
                
                <!-- 파일 불러오기 드롭다운 -->
                <select id="file-select" class="border border-gray-300 rounded px-2 py-1 bg-white text-xs outline-none focus:border-blue-500 w-32" title="저장된 파일 불러오기">
                    <option value="">파일 목록</option>
                </select>

                <!-- 파일 이름 입력 칸 (.md 자동 적용) -->
                <input type="text" id="file-name" value="untitled" class="border border-gray-300 rounded px-2 py-1 bg-white text-sm font-medium outline-none focus:border-blue-500 w-28" title="파일 이름 (.md 자동 적용)">
                <span class="text-gray-500 text-xs font-mono">.md</span>

                <button id="btn-save" class="px-2.5 py-1 bg-blue-600 text-white hover:bg-blue-700 rounded font-medium">수동저장</button>
                <span id="auto-save-status" class="text-gray-400 text-[11px] ml-1">폴더 미지정</span>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <select id="select-font" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="system">기본 고딕</option>
                    <option value="gulim">굴림체</option>
                    <option value="dodum">돋움체</option>
                    <option value="batang">바탕체</option>
                </select>

                <select id="select-align" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="justify">정렬: 양쪽</option>
                    <option value="left">정렬: 왼쪽</option>
                    <option value="center">정렬: 가운데</option>
                    <option value="right">정렬: 오른쪽</option>
                </select>

                <button id="btn-indent" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">들여쓰기: 끔</button>

                <select id="select-leading" class="border border-gray-300 rounded px-2 py-1 bg-white outline-none">
                    <option value="normal">줄간격: 보통(1.6)</option>
                    <option value="tight">줄간격: 좁게(1.3)</option>
                    <option value="loose">줄간격: 넓게(2.0)</option>
                </select>

                <button id="btn-para" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">문단간격: 없음</button>
                <button id="btn-margin" class="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700">여백: 있음</button>
                
                <button id="btn-lock" class="px-2 py-1 bg-amber-100 text-amber-800 hover:bg-amber-200 rounded font-medium">🔒 문단 잠금</button>
            </div>
        </header>

        <main id="main-container" class="flex-1 overflow-y-auto w-full transition-all duration-300">
            <div id="content-wrapper" class="max-w-3xl mx-auto px-6 py-12 w-full min-h-full flex flex-col">
                <div id="editor" contenteditable="true" spellcheck="false" class="outline-none flex-1 font-sans-system leading-normal-custom para-spacing-off" style="text-align: justify;"></div>
            </div>
        </main>

        <footer class="fixed bottom-3 right-6 text-gray-500 text-xs select-none z-50 pointer-events-none">
            공백 미포함 글자수: <span id="char-count">0</span>자
        </footer>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const charCountSpan = document.getElementById('char-count');
        const fileNameInput = document.getElementById('file-name');
        const fileSelect = document.getElementById('file-select');
        const autoSaveStatus = document.getElementById('auto-save-status');
        const contentWrapper = document.getElementById('content-wrapper');
        const contextMenu = document.getElementById('context-menu');
        
        let dirHandle = null;
        let isWideMargin = true;
        let isIndentOn = false;
        let isParaOn = false;
        let autoSaveTimer = null;
        let currentLockedBlock = null;

        // 지정 폴더 내 settings.json에 설정 저장
        async function saveSettings() {
            const settings = {
                font: document.getElementById('select-font').value,
                indent: isIndentOn,
                leading: document.getElementById('select-leading').value,
                para: isParaOn,
                margin: isWideMargin
            };
            
            localStorage.setItem('tdtd_app_settings', JSON.stringify(settings));

            if (dirHandle) {
                try {
                    const fileHandle = await dirHandle.getFileHandle('settings.json', { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(JSON.stringify(settings));
                    await writable.close();
                } catch (e) {
                    console.error('설정 파일 저장 실패:', e);
                }
            }
        }

        async function loadSettings() {
            let loadedSettings = null;
            if (dirHandle) {
                try {
                    const fileHandle = await dirHandle.getFileHandle('settings.json');
                    const file = await fileHandle.getFile();
                    loadedSettings = JSON.parse(await file.text());
                } catch (e) {}
            }
            if (!loadedSettings) {
                const saved = localStorage.getItem('tdtd_app_settings');
                if (saved) loadedSettings = JSON.parse(saved);
            }

            if (!loadedSettings) return;

            try {
                const s = loadedSettings;
                if (s.font) {
                    document.getElementById('select-font').value = s.font;
                    editor.classList.remove('font-sans-system', 'font-gulim', 'font-dodum', 'font-batang');
                    editor.classList.add('font-' + s.font);
                }
                if (s.indent !== undefined) {
                    isIndentOn = s.indent;
                    const btnIndent = document.getElementById('btn-indent');
                    if (isIndentOn) {
                        editor.classList.add('indent-on');
                        btnIndent.innerText = '들여쓰기: 켜짐';
                        btnIndent.classList.add('bg-blue-100', 'text-blue-800');
                    } else {
                        editor.classList.remove('indent-on');
                        btnIndent.innerText = '들여쓰기: 끔';
                        btnIndent.classList.remove('bg-blue-100', 'text-blue-800');
                    }
                }
                if (s.leading) {
                    document.getElementById('select-leading').value = s.leading;
                    editor.classList.remove('leading-tight-custom', 'leading-normal-custom', 'leading-loose-custom');
                    editor.classList.add('leading-' + s.leading + '-custom');
                }
                if (s.para !== undefined) {
                    isParaOn = s.para;
                    const btnPara = document.getElementById('btn-para');
                    if (isParaOn) {
                        editor.classList.remove('para-spacing-off');
                        editor.classList.add('para-spacing-on');
                        btnPara.innerText = '문단간격: 있음';
                        btnPara.classList.add('bg-blue-100', 'text-blue-800');
                    } else {
                        editor.classList.remove('para-spacing-on');
                        editor.classList.add('para-spacing-off');
                        btnPara.innerText = '문단간격: 없음';
                        btnPara.classList.remove('bg-blue-100', 'text-blue-800');
                    }
                }
                if (s.margin !== undefined) {
                    isWideMargin = s.margin;
                    const btnMargin = document.getElementById('btn-margin');
                    if (isWideMargin) {
                        contentWrapper.classList.add('max-w-3xl', 'px-6');
                        contentWrapper.classList.remove('px-16');
                        btnMargin.innerText = '여백: 있음';
                    } else {
                        contentWrapper.classList.remove('max-w-3xl', 'px-6');
                        contentWrapper.classList.add('px-16', 'w-full');
                        btnMargin.innerText = '여백: 없음';
                    }
                }
            } catch (e) {
                console.error('설정 적용 실패:', e);
            }
        }

        // 폴더 지정 버튼
        document.getElementById('btn-folder').addEventListener('click', async () => {
            try {
                dirHandle = await window.showDirectoryPicker();
                autoSaveStatus.innerText = '자동저장 켜짐';
                alert('저장 폴더가 지정되었습니다.');
                await loadFileList();
                await loadSettings();
            } catch (err) {
                console.error(err);
            }
        });

        // 파일 목록 불러오기 (맨 위에 안내 옵션 유지)
        async function loadFileList() {
            if (!dirHandle) return;
            fileSelect.innerHTML = '<option value="">파일 목록</option>';
            
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && entry.name.endsWith('.md')) {
                    const opt = document.createElement('option');
                    opt.value = entry.name;
                    opt.textContent = entry.name;
                    fileSelect.appendChild(opt);
                }
            }
        }

        // 드롭다운에서 기존 파일 선택 시 불러오기
        fileSelect.addEventListener('change', async (e) => {
            const val = e.target.value;
            if (!val || !dirHandle) return;

            try {
                const fileHandle = await dirHandle.getFileHandle(val);
                const file = await fileHandle.getFile();
                const text = await file.text();
                editor.innerHTML = text;
                fileNameInput.value = val.replace(/\.md$/, '');
                updateCharCount();
            } catch (err) {
                alert('파일 읽기 실패: ' + err.message);
            }
        });

        function updateCharCount() {
            const text = editor.innerText || '';
            const cleanText = text.trim();
            if (!cleanText) {
                charCountSpan.innerText = '0';
                return;
            }
            charCountSpan.innerText = cleanText.replace(/\s/g, '').length;
        }

        // 자동 저장 (.md 자동 결합)
        async function executeAutoSave() {
            if (!dirHandle) return;
            const rawName = fileNameInput.value.trim() || 'untitled';
            const title = rawName.endsWith('.md') ? rawName : rawName + '.md';

            try {
                const fileHandle = await dirHandle.getFileHandle(title, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(editor.innerHTML);
                await writable.close();
                autoSaveStatus.innerText = '저장됨';
                setTimeout(() => { autoSaveStatus.innerText = '자동저장 켜짐'; }, 2000);
            } catch (err) {
                autoSaveStatus.innerText = '저장 실패';
            }
        }

        editor.addEventListener('input', () => {
            updateCharCount();
            autoSaveStatus.innerText = '저장 중...';
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => { executeAutoSave(); }, 1000);
        });

        fileNameInput.addEventListener('change', () => {
            executeAutoSave();
            loadFileList();
        });

        // 수동 저장 버튼
        document.getElementById('btn-save').addEventListener('click', async () => {
            if (!dirHandle) {
                alert('먼저 "저장 폴더 지정" 버튼을 눌러주세요.');
                return;
            }
            await executeAutoSave();
            await loadFileList();
            alert('저장되었습니다.');
        });

        // 외부 복사 시 줄바꿈 최적화
        editor.addEventListener('copy', (e) => {
            const selection = window.getSelection();
            if (!selection.isCollapsed) {
                e.preventDefault();
                const range = selection.getRangeAt(0);
                const div = document.createElement('div');
                div.appendChild(range.cloneContents());

                function getCleanText(node) {
                    let result = '';
                    node.childNodes.forEach(child => {
                        if (child.nodeType === Node.TEXT_NODE) {
                            result += child.nodeValue;
                        } else if (child.nodeType === Node.ELEMENT_NODE) {
                            if (child.tagName === 'BR') {
                                result += '\n';
                            } else {
                                let inner = getCleanText(child);
                                if (['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI'].includes(child.tagName)) {
                                    if (inner.length > 0 && !inner.endsWith('\n')) {
                                        inner += '\n';
                                    }
                                }
                                result += inner;
                            }
                        }
                    });
                    return result;
                }

                let cleanText = getCleanText(div).replace(/\n{3,}/g, '\n\n').trim();
                e.clipboardData.setData('text/plain', cleanText);
            }
        });

        // 서식 제어 및 설정 저장 연동
        document.getElementById('select-font').addEventListener('change', (e) => {
            editor.classList.remove('font-sans-system', 'font-gulim', 'font-dodum', 'font-batang');
            editor.classList.add('font-' + e.target.value);
            saveSettings();
        });

        document.getElementById('select-align').addEventListener('change', (e) => {
            const align = e.target.value;
            let command = 'justifyLeft';
            if (align === 'center') command = 'justifyCenter';
            else if (align === 'right') command = 'justifyRight';
            else if (align === 'justify') command = 'justifyFull';
            
            document.execCommand(command, false, null);
            editor.focus();
            executeAutoSave();
        });

        const btnIndent = document.getElementById('btn-indent');
        btnIndent.addEventListener('click', () => {
            isIndentOn = !isIndentOn;
            if (isIndentOn) {
                editor.classList.add('indent-on');
                btnIndent.innerText = '들여쓰기: 켜짐';
                btnIndent.classList.add('bg-blue-100', 'text-blue-800');
            } else {
                editor.classList.remove('indent-on');
                btnIndent.innerText = '들여쓰기: 끔';
                btnIndent.classList.remove('bg-blue-100', 'text-blue-800');
            }
            saveSettings();
        });

        document.getElementById('select-leading').addEventListener('change', (e) => {
            editor.classList.remove('leading-tight-custom', 'leading-normal-custom', 'leading-loose-custom');
            editor.classList.add('leading-' + e.target.value + '-custom');
            saveSettings();
        });

        const btnPara = document.getElementById('btn-para');
        btnPara.addEventListener('click', () => {
            isParaOn = !isParaOn;
            if (isParaOn) {
                editor.classList.remove('para-spacing-off');
                editor.classList.add('para-spacing-on');
                btnPara.innerText = '문단간격: 있음';
                btnPara.classList.add('bg-blue-100', 'text-blue-800');
            } else {
                editor.classList.remove('para-spacing-on');
                editor.classList.add('para-spacing-off');
                btnPara.innerText = '문단간격: 없음';
                btnPara.classList.remove('bg-blue-100', 'text-blue-800');
            }
            saveSettings();
        });

        const btnMargin = document.getElementById('btn-margin');
        btnMargin.addEventListener('click', () => {
            isWideMargin = !isWideMargin;
            if (isWideMargin) {
                contentWrapper.classList.add('max-w-3xl', 'px-6');
                contentWrapper.classList.remove('px-16');
                btnMargin.innerText = '여백: 있음';
            } else {
                contentWrapper.classList.remove('max-w-3xl', 'px-6');
                contentWrapper.classList.add('px-16', 'w-full');
                btnMargin.innerText = '여백: 없음';
            }
            saveSettings();
        });

        // 문단 단위 잠금 처리 (선택 영역이 걸치는 문단들을 찾아 앞뒤로 줄 생성 및 잠금)
        document.getElementById('btn-lock').addEventListener('click', () => {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) {
                alert('잠글 문단 영역을 드래그하여 선택해주세요.');
                return;
            }

            const range = selection.getRangeAt(0);
            
            let blocks = Array.from(editor.querySelectorAll('p, div')).filter(el => el.parentElement === editor);
            if (blocks.length === 0) {
                if (editor.innerHTML.trim() !== '') {
                    editor.innerHTML = `<div>${editor.innerHTML}</div>`;
                    blocks = Array.from(editor.querySelectorAll('p, div')).filter(el => el.parentElement === editor);
                }
            }

            let targetBlocks = [];
            blocks.forEach(block => {
                const blockRange = document.createRange();
                blockRange.selectNodeContents(block);
                
                if (
                    range.compareBoundaryPoints(Range.END_TO_START, blockRange) <= 0 &&
                    range.compareBoundaryPoints(Range.START_TO_END, blockRange) >= 0
                ) {
                    targetBlocks.push(block);
                }
            });

            if (targetBlocks.length === 0) {
                let startNode = range.startContainer;
                let endNode = range.endContainer;
                let startBlock = startNode.nodeType === Node.TEXT_NODE ? startNode.parentElement : startNode;
                let endBlock = endNode.nodeType === Node.TEXT_NODE ? endNode.parentElement : endNode;

                while (startBlock && startBlock.parentElement !== editor && startBlock !== editor) startBlock = startBlock.parentElement;
                while (endBlock && endBlock.parentElement !== editor && endBlock !== editor) endBlock = endBlock.parentElement;

                if (startBlock && startBlock !== editor) targetBlocks.push(startBlock);
                if (endBlock && endBlock !== editor && endBlock !== startBlock) targetBlocks.push(endBlock);
            }

            if (targetBlocks.length === 0) {
                let parent = range.commonAncestorContainer;
                if (parent.nodeType === Node.TEXT_NODE) parent = parent.parentElement;
                while (parent && parent.parentElement !== editor && parent !== editor) parent = parent.parentElement;
                if (parent && parent !== editor) targetBlocks.push(parent);
            }

            targetBlocks.forEach(block => {
                block.setAttribute('contenteditable', 'false');
                block.classList.add('locked-paragraph');
            });

            window.getSelection().removeAllRanges();
            updateCharCount();
            executeAutoSave();
        });

        // 잠긴 문단 우클릭 시 컨텍스트 메뉴 표시
        editor.addEventListener('contextmenu', (e) => {
            const lockedBlock = e.target.closest('.locked-paragraph');
            if (lockedBlock) {
                e.preventDefault();
                currentLockedBlock = lockedBlock;
                
                contextMenu.style.display = 'block';
                contextMenu.style.left = e.pageX + 'px';
                contextMenu.style.top = e.pageY + 'px';
            } else {
                contextMenu.style.display = 'none';
            }
        });

        window.addEventListener('click', () => {
            contextMenu.style.display = 'none';
        });

        // 우클릭 메뉴에서 잠금 해제 실행
        document.getElementById('menu-unlock-btn').addEventListener('click', () => {
            if (currentLockedBlock) {
                currentLockedBlock.removeAttribute('contenteditable');
                currentLockedBlock.classList.remove('locked-paragraph');
                updateCharCount();
                executeAutoSave();
            }
            contextMenu.style.display = 'none';
            currentLockedBlock = null;
        });
    </script>
</body>
</html>
