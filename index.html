<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 집필 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        /* 문단 잠금: 본문 위치 유지, 텍스트 뒤에 회색 배경음영 적용 */
        .locked-paragraph {
            background-color: #e5e7eb;
            padding: 2px 6px;
            border-radius: 4px;
            user-select: text;
        }
        
        /* 문단별 상대 좌표 설정 (메모 기준점) */
        #editor p, #editor div {
            position: relative;
        }

        /* 메모가 있는 문단의 최소 높이는 syncMemoHeights()가 메모 높이에 맞춰 계산 */

        /* 우측 여백 메모 박스 (span 태그 기반, 300px 넉넉한 너비, 첫줄 나란히 정렬) */
        .para-memo {
            position: absolute;
            left: calc(100% + 1.5rem);
            top: 0;
            width: 300px;
            background-color: #f1f3f5;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            line-height: 1.4;
            border: none;
            outline: none;
            text-align: left;
            text-indent: 0 !important;
            z-index: 10;
            display: inline-block;
        }
        /* 문단 첫 줄과 메모를 잇는 연결선 */
        .para-memo::before {
            content: "";
            position: absolute;
            left: -1rem;
            top: 0.8em;
            width: 1rem;
            height: 1px;
            background-color: #cbd5e1;
        }

        /* 우클릭 커스텀 메뉴 스타일 */
        #context-menu, #title-context-menu {
            display: none;
            position: absolute;
            background: #ffffff;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-radius: 0.375rem;
            padding: 4px;
            z-index: 10000;
            font-size: 12px;
        }
        #context-menu button, #title-context-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 6px 12px;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 0.25rem;
            color: #374151;
        }
        #context-menu button:hover, #title-context-menu button:hover {
            background-color: #f3f4f6;
            color: #111827;
        }
        /* 플레이스홀더 스타일 */
        #editor:empty:before {
            content: "여기에 글을 작성하세요...";
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }
        /* 상단 버튼 공통 스타일 */
        .tb { padding: 4px 10px; border-radius: 4px; font-weight: 500; white-space: nowrap; transition: background-color .15s, color .15s; }
        .tb-neutral { background: #e5e7eb; color: #374151; }
        .tb-neutral:hover { background: #d1d5db; }
        .tb-switch { background: #e0f2fe; color: #075985; }   /* 값 순환 스위치: 연한 파랑 */
        .tb-switch:hover { background: #bae6fd; }
        .tb-toggle { background: #e5e7eb; color: #6b7280; }   /* on/off: 회색 */
        .tb-toggle:hover { background: #d1d5db; }
        .tb-toggle.on { background: #d1fae5; color: #065f46; } /* on/off: 연한 초록 */
        .tb-toggle.on:hover { background: #a7f3d0; }
        .tb-sep { width: 1px; height: 16px; background: #d1d5db; margin: 0 4px; }
        /* 폰트 스타일 */
        .font-sans-system { font-family: system-ui, -apple-system, sans-serif; }
        .font-gulim { font-family: 'Gulim', '굴림', sans-serif; }
        .font-dodum { font-family: 'Dodum', '돋움', sans-serif; }
        .font-batang { font-family: 'Batang', '바탕', serif; }

        /* 들여쓰기 (1em) */
        #editor.indent-on, #editor.indent-on p, #editor.indent-on div, #editor.indent-on li,
        #editor.indent-on h1, #editor.indent-on h2, #editor.indent-on h3 {
            text-indent: 1em !important;
        }
        #editor.indent-on .para-memo { text-indent: 0 !important; }

        /* 줄간격 */
        .leading-tight-custom { line-height: 1.3; }
        .leading-normal-custom { line-height: 1.6; }
        .leading-loose-custom { line-height: 2.0; }

        /* 문단 간격 */
        .para-spacing-on > p, .para-spacing-on > div { margin-bottom: 1em; }
        .para-spacing-off > p, .para-spacing-off > div { margin-bottom: 0; }
    </style>
</head>
<body class="bg-white text-gray-900 h-screen flex flex-col m-0 overflow-hidden">

    <!-- 최초 접속 / 폴더 미연결 시 뜨는 게이트키퍼 화면 -->
    <div id="gatekeeper-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center select-none">
        <!-- 1단계 안내 -->
        <div id="gate-step-1" class="max-w-md space-y-6">
            <p class="text-base font-medium text-gray-800 leading-relaxed">원고를 안전하게 보관하기 위해 저장 폴더를 선택하신 뒤 권한을 허용해주세요.</p>
            <button id="gate-btn-pick" class="px-5 py-2.5 bg-blue-600 text-white rounded font-medium text-sm hover:bg-blue-700 shadow-sm transition">저장 폴더 선택하기</button>
        </div>
        <!-- 2단계 안내 (폴더 지정 직후 1회 표출) -->
        <div id="gate-step-2" class="max-w-md space-y-6 hidden">
            <p class="text-base font-medium text-gray-800 leading-relaxed">브라우저 설정을 초기화하거나 쿠키 및 사이트 데이터를 삭제하면 폴더 연결 권한이 끊어질 수 있습니다. 폴더를 다시 연결하면 저장했던 원고들이 불러와집니다.</p>
            <button id="gate-btn-start" class="px-5 py-2.5 bg-blue-600 text-white rounded font-medium text-sm hover:bg-blue-700 shadow-sm transition">확인 및 시작하기</button>
        </div>
    </div>

    <!-- 우클릭 커스텀 메뉴 (문단 잠금 및 메모 관리용) -->
    <div id="context-menu">
        <button id="menu-lock-toggle-btn">🔒 문단 잠금</button>
        <button id="menu-memo-toggle-btn">📝 메모 추가</button>
    </div>

    <!-- 파일 제목 우클릭 메뉴 -->
    <div id="title-context-menu">
        <button id="menu-edit-title-btn">✏️ 이름 수정</button>
    </div>

    <div id="app-screen" class="flex flex-col h-full">
        <header class="flex items-center justify-between px-6 py-2.5 border-b border-gray-200 text-xs select-none bg-gray-50 flex-wrap gap-x-4 gap-y-2 flex-shrink-0">
            <!-- 파일 -->
            <div class="flex items-center gap-2 flex-wrap">
                <button id="btn-folder" class="tb tb-neutral">폴더 변경</button>

                <select id="file-select" class="border border-gray-300 rounded px-2 py-1 bg-white text-xs outline-none focus:border-blue-500 w-32" title="저장된 파일 불러오기">
                    <option value="">파일 목록</option>
                </select>

                <div id="file-title-wrapper" class="relative flex items-center">
                    <span id="file-title-display" class="border border-transparent hover:border-gray-300 rounded px-2 py-1 bg-transparent text-sm font-medium cursor-pointer" title="우클릭하여 이름 수정">untitled</span>
                    <input type="text" id="file-name" value="untitled" class="border border-gray-300 rounded px-2 py-1 bg-white text-sm font-medium outline-none focus:border-blue-500 w-28 hidden" title="파일 이름">
                </div>

                <button id="btn-save" class="tb bg-blue-600 text-white hover:bg-blue-700">저장</button>
                <button id="btn-export-txt" class="tb bg-emerald-600 text-white hover:bg-emerald-700">내보내기</button>
                <span id="auto-save-status" class="text-gray-400 text-[11px] ml-1">폴더 미지정</span>
            </div>

            <!-- 서식 / 화면 -->
            <div class="flex items-center gap-2 flex-wrap">
                <!-- 글자 -->
                <button id="btn-font" class="tb tb-switch" title="글씨체 전환">굴림체</button>
                <!-- 문단 -->
                <span class="tb-sep"></span>
                <button id="btn-align" class="tb tb-switch" title="선택한 문단 정렬 전환">양쪽</button>
                <button id="btn-leading" class="tb tb-switch" title="줄간격 전환">줄간격 1.6</button>
                <button id="btn-indent" class="tb tb-toggle" title="들여쓰기 켜기/끄기">들여쓰기</button>
                <button id="btn-para" class="tb tb-toggle" title="문단간격 켜기/끄기">문단간격</button>
                <!-- 화면 배치 -->
                <span class="tb-sep"></span>
                <button id="btn-margin" class="tb tb-switch" title="여백 전환">여백 중간</button>
                <button id="btn-toggle-pomo" class="tb tb-toggle on" title="뽀모 보이기/숨기기">뽀모</button>
                <!-- 잠금 -->
                <span class="tb-sep"></span>
                <button id="btn-unlock-all" class="tb tb-neutral">🔓 전체 잠금 해제</button>
            </div>
        </header>

        <!-- 메인 집필 화면 (왼쪽 여백 뽀모도로 + 중앙 본문 영역) -->
        <div class="flex-1 flex overflow-hidden relative">
            <!-- 왼쪽 여백 뽀모도로 타이머 패널 (선 없음, 하단에 최근 기록 5줄 배치) -->
            <aside id="pomodoro-sidebar" class="absolute left-0 top-0 bottom-0 w-64 p-4 pb-14 flex flex-col justify-between text-xs select-none z-20 pointer-events-none">
                <div class="space-y-2">
                    <div class="flex items-center gap-2">
                        <button id="pomo-control-btn" class="pointer-events-auto px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-gray-700 font-medium">시작</button>
                        <span id="pomo-display" class="text-gray-700 font-medium">작업중 25:00</span>
                    </div>
                </div>
                <div class="pt-4">
                    <div id="pomo-logs" class="space-y-1 text-gray-500 text-[11px]"></div>
                </div>
            </aside>

            <!-- 본문 영역 스크롤바 -->
            <main id="main-container" class="flex-1 overflow-y-auto w-full transition-all duration-300">
                <div id="content-wrapper" class="w-full min-h-full flex flex-col py-12" style="padding-left:24px;padding-right:24px;transition:padding .2s;">
                    <div id="editor" contenteditable="true" spellcheck="false" class="outline-none flex-1 font-gulim leading-normal-custom para-spacing-off" style="text-align: justify; padding-bottom: 50vh;"></div>
                </div>
            </main>
        </div>

        <!-- 하단 글자수 표기 바 (고정형) -->
        <footer class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-sm border-t border-gray-200 py-2 px-6 text-gray-500 text-xs select-none z-40 flex justify-end">
            <span id="char-count">글자수 0 (0)</span>
        </footer>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const charCountSpan = document.getElementById('char-count');
        const fileNameInput = document.getElementById('file-name');
        const fileTitleDisplay = document.getElementById('file-title-display');
        const fileTitleWrapper = document.getElementById('file-title-wrapper');
        const titleContextMenu = document.getElementById('title-context-menu');
        const fileSelect = document.getElementById('file-select');
        const autoSaveStatus = document.getElementById('auto-save-status');
        const contentWrapper = document.getElementById('content-wrapper');
        const contextMenu = document.getElementById('context-menu');
        const btnFolder = document.getElementById('btn-folder');
        const mainContainer = document.getElementById('main-container');
        
        const gatekeeperScreen = document.getElementById('gatekeeper-screen');
        const gateStep1 = document.getElementById('gate-step-1');
        const gateStep2 = document.getElementById('gate-step-2');
        const gateBtnPick = document.getElementById('gate-btn-pick');
        const gateBtnStart = document.getElementById('gate-btn-start');

        let dirHandle = null;
        let marginMode = 2; // 0: 없음, 1: 좁음, 2: 중간, 3: 넓음
        let isIndentOn = false;
        let isParaOn = false;
        let autoSaveTimer = null;
        let currentBlock = null;

        // 뽀모도로 관련 변수
        let pomoInterval = null;
        let pomoSeconds = 25 * 60;
        let pomoIsWork = true; // true: 작업중(25분), false: 휴식중(5분)
        let pomoRunning = false;
        let pomoVisible = true;

        // IndexedDB를 이용한 디렉토리 핸들 저장/조회
        const DB_NAME = 'TdtdAppDB';
        const STORE_NAME = 'handles';

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveHandleToDB(handle) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(handle, 'savedDirHandle');
                return new Promise((resolve, reject) => {
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                console.error('핸들 DB 저장 실패:', e);
            }
        }

        async function getHandleFromDB() {
            try {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const request = tx.objectStore(STORE_NAME).get('savedDirHandle');
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (e) {
                return null;
            }
        }

        // 앱 시작 시 폴더 권한 확인 및 게이트키퍼 제어
        window.addEventListener('DOMContentLoaded', async () => {
            applyAllUI();
            await loadSettings();
            const savedHandle = await getHandleFromDB();
            if (savedHandle) {
                if ((await savedHandle.queryPermission({ mode: 'readwrite' })) === 'granted') {
                    dirHandle = savedHandle;
                    autoSaveStatus.innerText = '자동저장 켜짐';
                    gatekeeperScreen.style.display = 'none';
                    await initAppAfterFolderConnected();
                } else {
                    dirHandle = savedHandle;
                    gatekeeperScreen.style.display = 'flex';
                }
            } else {
                gatekeeperScreen.style.display = 'flex';
            }
        });

        // 게이트키퍼 폴더 지정 버튼
        gateBtnPick.addEventListener('click', async () => {
            try {
                dirHandle = await window.showDirectoryPicker();
                await saveHandleToDB(dirHandle);
                gateStep1.classList.add('hidden');
                gateStep2.classList.remove('hidden');
            } catch (err) {
                console.error(err);
            }
        });

        // 게이트키퍼 최종 시작 버튼
        gateBtnStart.addEventListener('click', async () => {
            gatekeeperScreen.style.display = 'none';
            autoSaveStatus.innerText = '자동저장 켜짐';
            await initAppAfterFolderConnected();
        });

        async function initAppAfterFolderConnected() {
            await loadFileList();
            await loadSettings();
            await loadPomodoroLogs();

            // 직전에 작업하던 파일 불러오기 시도
            const lastFile = localStorage.getItem('tdtd_last_file');
            if (lastFile) {
                try {
                    const fileHandle = await dirHandle.getFileHandle(lastFile);
                    const file = await fileHandle.getFile();
                    const text = await file.text();
                    editor.innerHTML = text;
                    const cleanName = lastFile.replace(/\.md$/, '');
                    fileNameInput.value = cleanName;
                    fileTitleDisplay.innerText = cleanName;
                    fileSelect.value = lastFile;
                    updateCharCount();
                } catch (e) {
                    console.error('마지막 파일 로드 실패:', e);
                }
            }
        }

        // ---------- 서식 상태 / UI 적용 ----------
        const FONTS = [['gulim', '굴림체'], ['dodum', '돋움체'], ['batang', '바탕체']];
        const LEADINGS = [['tight', '1.3'], ['normal', '1.6'], ['loose', '2.0']];
        const MARGIN_LABELS = ['없음', '좁음', '중간', '넓음'];
        const MARGIN_WIDTHS = [0, 1024, 768, 576];
        let fontKey = 'gulim';
        let leadingKey = 'normal';

        const btnFont = document.getElementById('btn-font');
        const btnLeading = document.getElementById('btn-leading');
        const btnIndent = document.getElementById('btn-indent');
        const btnPara = document.getElementById('btn-para');
        const btnMargin = document.getElementById('btn-margin');

        function applyFont() {
            if (!FONTS.some(f => f[0] === fontKey)) fontKey = 'gulim';
            editor.classList.remove('font-sans-system', 'font-gulim', 'font-dodum', 'font-batang');
            editor.classList.add('font-' + fontKey);
            btnFont.innerText = FONTS.find(f => f[0] === fontKey)[1];
            syncMemoHeights();
        }
        function applyLeading() {
            if (!LEADINGS.some(l => l[0] === leadingKey)) leadingKey = 'normal';
            editor.classList.remove('leading-tight-custom', 'leading-normal-custom', 'leading-loose-custom');
            editor.classList.add('leading-' + leadingKey + '-custom');
            btnLeading.innerText = '줄간격 ' + LEADINGS.find(l => l[0] === leadingKey)[1];
        }
        function applyIndent() {
            editor.classList.toggle('indent-on', isIndentOn);
            btnIndent.classList.toggle('on', isIndentOn);
        }
        function applyPara() {
            editor.classList.toggle('para-spacing-on', isParaOn);
            editor.classList.toggle('para-spacing-off', !isParaOn);
            btnPara.classList.toggle('on', isParaOn);
            syncMemoHeights();
        }
        function applyMarginMode() {
            btnMargin.innerText = '여백 ' + MARGIN_LABELS[marginMode];
            applyLayout();
        }
        function applyPomoVisibility() {
            pomoSidebar.style.display = pomoVisible ? 'flex' : 'none';
            btnTogglePomo.classList.toggle('on', pomoVisible);
            applyLayout();
        }
        function applyAllUI() {
            applyFont(); applyLeading(); applyIndent(); applyPara(); applyMarginMode(); applyPomoVisibility();
        }

        /* ---------- 레이아웃 ----------
           - 본문은 기본적으로 중앙.
           - 여백이 있을 때: 뽀모(왼쪽)·메모(오른쪽)는 여백 영역에만 표시 → 본문 위치 불변(좌우 대칭).
             단, 창이 좁아 여백 영역에 안 들어가면 본문 폭만 줄여서 확보.
           - 여백 없음: 뽀모/메모가 실제로 필요한 만큼만 양쪽에서 영역을 내주고 나머지는 본문이 꽉 채움(비대칭 가능). */
        const POMO_W = 256;   // 뽀모 패널 폭
        const MEMO_W = 340;   // 메모 폭(300) + 연결선(24) + 여유
        const BASE_PAD = 24;  // 기본 좌우 여백

        function applyLayout() {
            const W = mainContainer.clientWidth;
            if (!W) return;
            const hasMemo = !!editor.querySelector('.para-memo');
            const pomoNeed = pomoVisible ? POMO_W : 0;
            const memoNeed = hasMemo ? MEMO_W : 0;
            let left, right;

            if (marginMode === 0) {
                left = Math.max(BASE_PAD, pomoNeed);
                right = Math.max(BASE_PAD, memoNeed);
            } else {
                const side = Math.max(BASE_PAD, pomoNeed, memoNeed);
                let bodyW = Math.min(MARGIN_WIDTHS[marginMode], W - 2 * side);
                bodyW = Math.max(bodyW, Math.min(320, W - 2 * BASE_PAD));
                left = right = Math.max(BASE_PAD, (W - bodyW) / 2);
            }
            contentWrapper.style.paddingLeft = left + 'px';
            contentWrapper.style.paddingRight = right + 'px';
        }
        new ResizeObserver(applyLayout).observe(mainContainer);

        // 지정 폴더 내 settings.json에 설정 저장
        async function saveSettings() {
            const settings = {
                font: fontKey,
                indent: isIndentOn,
                leading: leadingKey,
                para: isParaOn,
                margin: marginMode
            };

            localStorage.setItem('tdtd_app_settings', JSON.stringify(settings));

            if (dirHandle) {
                try {
                    const fileHandle = await dirHandle.getFileHandle('settings.json', { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(JSON.stringify(settings));
                    await writable.close();
                } catch (e) {
                    console.error('설정 파일 저장 실패:', e);
                }
            }
        }

        async function loadSettings() {
            let s = null;
            if (dirHandle) {
                try {
                    const fileHandle = await dirHandle.getFileHandle('settings.json');
                    const file = await fileHandle.getFile();
                    s = JSON.parse(await file.text());
                } catch (e) {}
            }
            if (!s) {
                const saved = localStorage.getItem('tdtd_app_settings');
                if (saved) s = JSON.parse(saved);
            }
            if (!s) return;

            try {
                if (s.font) fontKey = s.font;                 // 예전 'system' 값은 굴림체로 대체됨
                if (s.indent !== undefined) isIndentOn = !!s.indent;
                if (s.leading) leadingKey = s.leading;
                if (s.para !== undefined) isParaOn = !!s.para;
                if (s.margin !== undefined) marginMode = s.margin;
                applyAllUI();
            } catch (e) {
                console.error('설정 적용 실패:', e);
            }
        }

        // 스위치 버튼들: 클릭할 때마다 값 순환
        btnMargin.addEventListener('click', () => {
            marginMode = (marginMode + 1) % 4;
            applyMarginMode();
            saveSettings();
        });
        btnFont.addEventListener('click', () => {
            const i = FONTS.findIndex(f => f[0] === fontKey);
            fontKey = FONTS[(i + 1) % FONTS.length][0];
            applyFont();
            saveSettings();
        });
        btnLeading.addEventListener('click', () => {
            const i = LEADINGS.findIndex(l => l[0] === leadingKey);
            leadingKey = LEADINGS[(i + 1) % LEADINGS.length][0];
            applyLeading();
            saveSettings();
        });
        btnIndent.addEventListener('click', () => {
            isIndentOn = !isIndentOn;
            applyIndent();
            saveSettings();
        });
        btnPara.addEventListener('click', () => {
            isParaOn = !isParaOn;
            applyPara();
            saveSettings();
        });

        // 폴더 지정 버튼 (헤더)
        btnFolder.addEventListener('click', async () => {
            try {
                dirHandle = await window.showDirectoryPicker();
                await saveHandleToDB(dirHandle);
                autoSaveStatus.innerText = '자동저장 켜짐';
                await initAppAfterFolderConnected();
            } catch (err) {
                console.error(err);
            }
        });

        // 파일 목록 불러오기
        async function loadFileList() {
            if (!dirHandle) return;
            fileSelect.innerHTML = '<option value="">파일 목록</option>';
            
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && entry.name.endsWith('.md')) {
                    const opt = document.createElement('option');
                    opt.value = entry.name;
                    opt.textContent = entry.name.replace(/\.md$/, '');
                    fileSelect.appendChild(opt);
                }
            }
        }

        // 드롭다운에서 기존 파일 선택 시 불러오기
        fileSelect.addEventListener('change', async (e) => {
            const val = e.target.value;
            if (!val || !dirHandle) return;

            const fullName = val.endsWith('.md') ? val : val + '.md';
            try {
                const fileHandle = await dirHandle.getFileHandle(fullName);
                const file = await fileHandle.getFile();
                const text = await file.text();
                editor.innerHTML = text;
                const cleanName = val.replace(/\.md$/, '');
                fileNameInput.value = cleanName;
                fileTitleDisplay.innerText = cleanName;
                localStorage.setItem('tdtd_last_file', fullName);
                updateCharCount();
            } catch (err) {
                alert('파일 읽기 실패: ' + err.message);
            }
        });

        // 글자수 표기 (메모 영역 제외하고 본문 텍스트만 계산)
        // 메모가 문단보다 길면 그만큼만 문단 아래 공간 확보 (메모 높이 - 문단 아래 간격).
        // 메모가 문단 안에 들어가면 추가 여백 없음.
        function syncMemoHeights() {
            Array.from(editor.children).forEach(block => {
                const memo = block.querySelector(':scope > .para-memo');
                if (!memo) {
                    if (block.style.minHeight) {
                        block.style.minHeight = '';
                        if (!block.getAttribute('style')) block.removeAttribute('style');
                    }
                    return;
                }
                const mb = parseFloat(getComputedStyle(block).marginBottom) || 0;
                const need = Math.max(0, Math.ceil(memo.offsetHeight - mb));
                block.style.minHeight = need + 'px';
            });
        }

        function updateCharCount() {
            syncMemoHeights();
            const clone = editor.cloneNode(true);
            clone.querySelectorAll('.para-memo').forEach(m => m.remove());
            const text = clone.innerText || '';
            const cleanText = text.trim();
            const withSpaces = cleanText.length;
            const withoutSpaces = cleanText.replace(/\s/g, '').length;
            charCountSpan.innerText = `글자수 ${withSpaces.toLocaleString()} (${withoutSpaces.toLocaleString()})`;
            applyLayout(); // 메모 유무에 따라 레이아웃 갱신
        }

        // 커서 위치가 화면 하단에 가려지지 않도록 스크롤 자동 보정 (5줄 여유 유지)
        function ensureCursorVisible() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            const range = selection.getRangeAt(0);
            
            let rect = range.getBoundingClientRect();
            if (rect.top === 0 && rect.bottom === 0) {
                const span = document.createElement('span');
                span.textContent = '\u200b';
                range.insertNode(span);
                rect = span.getBoundingClientRect();
                span.remove();
            }

            const containerRect = mainContainer.getBoundingClientRect();
            const bottomThreshold = containerRect.bottom - 150;

            if (rect.bottom > bottomThreshold) {
                mainContainer.scrollTop += (rect.bottom - bottomThreshold);
            }
        }

        // 자동 저장
        async function executeAutoSave() {
            if (!dirHandle) return;
            const rawName = fileNameInput.value.trim() || 'untitled';
            const title = rawName.endsWith('.md') ? rawName : rawName + '.md';
            localStorage.setItem('tdtd_last_file', title);

            try {
                const fileHandle = await dirHandle.getFileHandle(title, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(editor.innerHTML);
                await writable.close();
                autoSaveStatus.innerText = '저장됨';
                setTimeout(() => { autoSaveStatus.innerText = '자동저장 켜짐'; }, 2000);
            } catch (err) {
                autoSaveStatus.innerText = '저장 실패';
            }
        }

        editor.addEventListener('input', () => {
            updateCharCount();
            ensureCursorVisible();
            autoSaveStatus.innerText = '저장 중...';
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => { executeAutoSave(); }, 1000);
        });

        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                setTimeout(ensureCursorVisible, 10);
            }

            // 메모 박스 내부에서 Ctrl+A를 누를 경우 해당 메모박스 안의 텍스트만 선택되도록 처리
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
                const selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    let node = selection.anchorNode;
                    let memoBox = node.nodeType === Node.TEXT_NODE ? node.parentElement.closest('.para-memo') : node.closest('.para-memo');
                    if (memoBox) {
                        e.preventDefault();
                        const range = document.createRange();
                        range.selectNodeContents(memoBox);
                        selection.removeAllRanges();
                        selection.addRange(range);
                    }
                }
            }
        });

        // 파일 제목 수정 후 엔터 시 고정 모드 전환
        fileNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                commitTitleEdit();
            }
        });

        fileNameInput.addEventListener('blur', () => {
            commitTitleEdit();
        });

        function commitTitleEdit() {
            let val = fileNameInput.value.trim() || 'untitled';
            val = val.replace(/\.md$/, '');
            fileNameInput.value = val;
            fileTitleDisplay.innerText = val;
            fileNameInput.classList.add('hidden');
            fileTitleDisplay.classList.remove('hidden');
            executeAutoSave();
            loadFileList();
        }

        // 파일 제목 영역 우클릭 메뉴 처리
        fileTitleDisplay.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            titleContextMenu.style.display = 'block';
            titleContextMenu.style.left = e.pageX + 'px';
            titleContextMenu.style.top = e.pageY + 'px';
        });

        document.getElementById('menu-edit-title-btn').addEventListener('click', () => {
            titleContextMenu.style.display = 'none';
            fileTitleDisplay.classList.add('hidden');
            fileNameInput.classList.remove('hidden');
            fileNameInput.focus();
            fileNameInput.select();
        });

        // 수동 저장 버튼
        document.getElementById('btn-save').addEventListener('click', async () => {
            if (!dirHandle) {
                alert('먼저 "저장 폴더 지정" 버튼을 눌러주세요.');
                return;
            }
            await executeAutoSave();
            await loadFileList();
            alert('저장되었습니다.');
        });

        // TXT 내보내기 버튼 (메모 제외 및 줄바꿈 유지)
        document.getElementById('btn-export-txt').addEventListener('click', async () => {
            const rawName = fileNameInput.value.trim() || 'untitled';
            const fileName = rawName.replace(/\.md$/, '') + '.txt';

            const div = document.createElement('div');
            div.innerHTML = editor.innerHTML;
            div.querySelectorAll('.para-memo').forEach(m => m.remove());

            function getCleanText(node) {
                let result = '';
                node.childNodes.forEach(child => {
                    if (child.nodeType === Node.TEXT_NODE) {
                        result += child.nodeValue;
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        if (child.tagName === 'BR') {
                            result += '\n';
                        } else {
                            let inner = getCleanText(child);
                            if (['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI'].includes(child.tagName)) {
                                if (inner.length > 0 && !inner.endsWith('\n')) {
                                    inner += '\n';
                                }
                            }
                            result += inner;
                        }
                    }
                });
                return result;
            }

            let cleanText = getCleanText(div).replace(/\n{3,}/g, '\n\n').trim();

            if (dirHandle) {
                try {
                    const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(cleanText);
                    await writable.close();
                    alert(`연결된 폴더에 TXT 파일이 저장되었습니다:\n${fileName}`);
                    return;
                } catch (err) {
                    console.error('폴더 내 TXT 저장 실패:', err);
                }
            }

            const blob = new Blob([cleanText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // 외부 복사 시 줄바꿈 최적화
        editor.addEventListener('copy', (e) => {
            const selection = window.getSelection();
            if (!selection.isCollapsed) {
                e.preventDefault();
                const range = selection.getRangeAt(0);
                const div = document.createElement('div');
                div.appendChild(range.cloneContents());
                div.querySelectorAll('.para-memo').forEach(m => m.remove());

                function getCleanText(node) {
                    let result = '';
                    node.childNodes.forEach(child => {
                        if (child.nodeType === Node.TEXT_NODE) {
                            result += child.nodeValue;
                        } else if (child.nodeType === Node.ELEMENT_NODE) {
                            if (child.tagName === 'BR') {
                                result += '\n';
                            } else {
                                let inner = getCleanText(child);
                                if (['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'LI'].includes(child.tagName)) {
                                    if (inner.length > 0 && !inner.endsWith('\n')) {
                                        inner += '\n';
                                    }
                                }
                                result += inner;
                            }
                        }
                    });
                    return result;
                }

                let cleanText = getCleanText(div).replace(/\n{3,}/g, '\n\n').trim();
                e.clipboardData.setData('text/plain', cleanText);
            }
        });

        // 정렬 스위치: 커서가 있는 문단(또는 선택 문단)에 적용, 라벨은 현재 문단 정렬을 표시
        const ALIGNS = [['justify', '양쪽', 'justifyFull'], ['left', '왼쪽', 'justifyLeft'], ['center', '가운데', 'justifyCenter'], ['right', '오른쪽', 'justifyRight']];
        const btnAlign = document.getElementById('btn-align');
        let alignIdx = 0;

        btnAlign.addEventListener('mousedown', (e) => e.preventDefault()); // 에디터 선택 영역 유지
        btnAlign.addEventListener('click', () => {
            const sel = window.getSelection();
            if (!sel.rangeCount || !editor.contains(sel.anchorNode)) editor.focus();
            alignIdx = (alignIdx + 1) % ALIGNS.length;
            document.execCommand(ALIGNS[alignIdx][2], false, null);
            btnAlign.innerText = ALIGNS[alignIdx][1];
            editor.focus();
            executeAutoSave();
        });

        document.addEventListener('selectionchange', () => {
            const sel = window.getSelection();
            if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return;
            const block = getParentBlock(sel.anchorNode);
            let ta = getComputedStyle(block || editor).textAlign;
            if (ta === 'start') ta = 'left';
            const i = ALIGNS.findIndex(a => a[0] === ta);
            if (i >= 0) { alignIdx = i; btnAlign.innerText = ALIGNS[i][1]; }
        });

        // --- 뽀모도로 타이머 로직 ---
        const pomoSidebar = document.getElementById('pomodoro-sidebar');
        const btnTogglePomo = document.getElementById('btn-toggle-pomo');
        const pomoControlBtn = document.getElementById('pomo-control-btn');
        const pomoDisplay = document.getElementById('pomo-display');
        const pomoLogsContainer = document.getElementById('pomo-logs');

        btnTogglePomo.addEventListener('click', () => {
            pomoVisible = !pomoVisible;
            applyPomoVisibility();
        });

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updatePomoDisplay() {
            const stateStr = pomoIsWork ? '작업중' : '휴식중';
            pomoDisplay.innerText = `${stateStr} ${formatTime(pomoSeconds)}`;
        }

        pomoControlBtn.addEventListener('click', () => {
            if (!pomoRunning) {
                pomoRunning = true;
                pomoControlBtn.innerText = '정지';
                startPomoTimer();
            } else {
                pomoRunning = false;
                pomoControlBtn.innerText = '시작';
                clearInterval(pomoInterval);
            }
        });

        function startPomoTimer() {
            if (pomoInterval) clearInterval(pomoInterval);
            pomoInterval = setInterval(async () => {
                pomoSeconds--;
                if (pomoSeconds < 0) {
                    if (pomoIsWork) {
                        // 작업 주기 종료 시점: 글자수 기록 생성 및 JSON 저장
                        await recordPomoCompletion();
                        // 휴식 전환 (5분)
                        pomoIsWork = false;
                        pomoSeconds = 5 * 60;
                    } else {
                        // 휴식 주기 종료 -> 작업 전환 (25분)
                        pomoIsWork = true;
                        pomoSeconds = 25 * 60;
                    }
                }
                updatePomoDisplay();
            }, 1000);
        }

        async function recordPomoCompletion() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            // 글자수 계산 (메모 제외)
            const clone = editor.cloneNode(true);
            clone.querySelectorAll('.para-memo').forEach(m => m.remove());
            const text = (clone.innerText || '').trim();
            const withSpaces = text.length;
            const withoutSpaces = text.replace(/\s/g, '').length;

            const logEntry = {
                date: dateStr,
                time: timeStr,
                withSpaces: withSpaces,
                withoutSpaces: withoutSpaces
            };

            // 기존 로그 불러오기 및 추가
            let allLogs = [];
            if (dirHandle) {
                try {
                    const fileHandle = await dirHandle.getFileHandle('pomodoro_logs.json', { create: true });
                    const file = await fileHandle.getFile();
                    const textContent = await file.text();
                    if (textContent.trim()) {
                        allLogs = JSON.parse(textContent);
                    }
                } catch (e) {}

                allLogs.push(logEntry);

                try {
                    const fileHandle = await dirHandle.getFileHandle('pomodoro_logs.json', { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(JSON.stringify(allLogs, null, 2));
                    await writable.close();
                } catch (e) {
                    console.error('뽀모도로 로그 파일 저장 실패:', e);
                }
            }
            renderPomoLogs(allLogs);
        }

        async function loadPomodoroLogs() {
            if (!dirHandle) return;
            try {
                const fileHandle = await dirHandle.getFileHandle('pomodoro_logs.json');
                const file = await fileHandle.getFile();
                const textContent = await file.text();
                if (textContent.trim()) {
                    const allLogs = JSON.parse(textContent);
                    renderPomoLogs(allLogs);
                }
            } catch (e) {
                // 파일이 없으면 무시
            }
        }

        function renderPomoLogs(allLogs) {
            pomoLogsContainer.innerHTML = '';
            // 날짜 상관없이 최근 기록 5개만 가져오기
            const recentLogs = allLogs.slice(-5);
            recentLogs.forEach(log => {
                const div = document.createElement('div');
                div.textContent = `${log.time} 공백포함글자수 ${log.withSpaces} (${log.withoutSpaces})`;
                pomoLogsContainer.appendChild(div);
            });
        }

        // --- 문단 잠금 및 기타 헬퍼 ---
        function getParentBlock(node) {
            if (!node) return null;
            let block = node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
            while (block && block.parentElement !== editor && block !== editor) {
                block = block.parentElement;
            }
            return (block && block !== editor && editor.contains(block)) ? block : null;
        }

        function getNormalizedSelectionRange() {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return null;
            let range = selection.getRangeAt(0).cloneRange();

            if (range.endOffset === 0 && !range.collapsed) {
                let container = range.endContainer;
                try {
                    if (container.nodeType === Node.TEXT_NODE) {
                        if (container.previousSibling) {
                            range.setEndAfter(container.previousSibling);
                        } else if (container.parentNode && container.parentNode !== editor) {
                            range.setEndBefore(container.parentNode);
                        }
                    } else if (container.nodeType === Node.ELEMENT_NODE) {
                        let prev = container.previousElementSibling || container.previousSibling;
                        if (prev) {
                            range.setEndAfter(prev);
                        }
                    }
                } catch (e) {}
            }
            return range;
        }

        document.getElementById('btn-unlock-all').addEventListener('click', () => {
            const lockedBlocks = editor.querySelectorAll('.locked-paragraph, [contenteditable="false"]');
            if (lockedBlocks.length === 0) {
                alert('잠긴 문단이 없습니다.');
                return;
            }
            lockedBlocks.forEach(block => {
                if (block.classList.contains('para-memo')) return;
                block.removeAttribute('contenteditable');
                block.classList.remove('locked-paragraph');
            });
            updateCharCount();
            executeAutoSave();
            alert('모든 문단 잠금이 해제되었습니다.');
        });

        editor.addEventListener('contextmenu', (e) => {
            const block = getParentBlock(e.target);
            if (block && !e.target.classList.contains('para-memo')) {
                e.preventDefault();
                currentBlock = block;
                
                const isLocked = block.classList.contains('locked-paragraph') || block.getAttribute('contenteditable') === 'false';
                const hasMemo = block.querySelector('.para-memo') !== null;

                document.getElementById('menu-lock-toggle-btn').innerText = isLocked ? '🔓 잠금 해제' : '🔒 문단 잠금';
                document.getElementById('menu-memo-toggle-btn').innerText = hasMemo ? '🗑️ 메모 삭제' : '📝 메모 추가';
                
                contextMenu.style.display = 'block';
                contextMenu.style.left = e.pageX + 'px';
                contextMenu.style.top = e.pageY + 'px';
            } else {
                contextMenu.style.display = 'none';
            }
        });

        window.addEventListener('click', () => {
            contextMenu.style.display = 'none';
            titleContextMenu.style.display = 'none';
        });

        document.getElementById('menu-lock-toggle-btn').addEventListener('click', () => {
            if (currentBlock) {
                const isLocked = currentBlock.classList.contains('locked-paragraph') || currentBlock.getAttribute('contenteditable') === 'false';
                
                if (isLocked) {
                    currentBlock.removeAttribute('contenteditable');
                    currentBlock.classList.remove('locked-paragraph');
                } else {
                    currentBlock.setAttribute('contenteditable', 'false');
                    currentBlock.classList.add('locked-paragraph');
                }
                updateCharCount();
                executeAutoSave();
            }
            contextMenu.style.display = 'none';
            currentBlock = null;
        });

        document.getElementById('menu-memo-toggle-btn').addEventListener('click', () => {
            if (currentBlock) {
                const existingMemo = currentBlock.querySelector('.para-memo');
                if (existingMemo) {
                    existingMemo.remove();
                    currentBlock.classList.remove('has-memo');
                } else {
                    const memoSpan = document.createElement('span');
                    memoSpan.className = 'para-memo';
                    memoSpan.setAttribute('contenteditable', 'true');
                    memoSpan.setAttribute('spellcheck', 'false');
                    currentBlock.appendChild(memoSpan);
                    currentBlock.classList.add('has-memo');
                    memoSpan.focus();
                }
                updateCharCount();
                executeAutoSave();
            }
            contextMenu.style.display = 'none';
            currentBlock = null;
        });
    </script>
</body>
</html>
