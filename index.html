<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>집필기</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px system-ui,-apple-system,'Segoe UI',sans-serif;color:#111827;background:#fff;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit}
button{border:0;cursor:pointer}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center;padding:10px 24px;background:#f9fafb;border-bottom:1px solid #e5e7eb;font-size:12px;user-select:none}
.g{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tb{padding:4px 10px;border-radius:4px;font-weight:500;white-space:nowrap;background:#e5e7eb;color:#374151}
.tb:hover{background:#d1d5db}
.sw{background:#e0f2fe;color:#075985}.sw:hover{background:#bae6fd}
.tg{color:#6b7280}.tg.on{background:#d1fae5;color:#065f46}.tg.on:hover{background:#a7f3d0}
.pri{background:#2563eb;color:#fff}.pri:hover{background:#1d4ed8}
.exp{background:#059669;color:#fff}.exp:hover{background:#047857}
.sep{width:1px;height:16px;background:#d1d5db}
#fs,#ti{border:1px solid #d1d5db;border-radius:4px;padding:4px 8px;background:#fff;font-size:12px}
#fs{width:130px}#ti{width:120px;font-size:14px;font-weight:500}
#tt{padding:4px 8px;border:1px solid transparent;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer}
#tt:hover{border-color:#d1d5db}
#st{color:#9ca3af;font-size:11px}
.hide{display:none!important}
#area{flex:1;position:relative;overflow:hidden}
#main{position:absolute;inset:0;overflow-y:auto}
#wrap{min-height:100%;padding:48px 24px;transition:padding .2s}
#ed{outline:none;text-align:justify;padding-bottom:50vh;min-height:60vh;word-break:break-word}
#ed:empty:before{content:"여기에 글을 작성하세요...";color:#9ca3af;pointer-events:none}
#ed div,#ed p{position:relative;margin:0}
#ed.gap>div,#ed.gap>p{margin-bottom:1em}
#ed.ind,#ed.ind div,#ed.ind p{text-indent:1em}
#ed .memo{text-indent:0!important}
.lk{background:#e5e7eb;padding:2px 6px;border-radius:4px;user-select:text}
.memo{position:absolute;left:calc(100% + 1.5rem);top:0;width:300px;display:inline-block;background:#f1f3f5;padding:2px 12px;border-radius:4px;font-size:.85rem;line-height:1.4;text-align:left;font-family:system-ui,sans-serif;outline:none;z-index:10;user-select:none;-webkit-user-select:none}
.memo[contenteditable=true]{user-select:text;-webkit-user-select:text}
.memo:before{content:"";position:absolute;left:-1rem;top:.8em;width:1rem;height:1px;background:#cbd5e1}
#pomo{position:absolute;left:0;top:0;bottom:0;width:256px;padding:16px 16px 56px;flex-direction:column;justify-content:space-between;z-index:20;pointer-events:none;user-select:none;font-size:12px}
#pomo button{pointer-events:auto;padding:4px 12px;border-radius:4px;background:#e5e7eb;color:#374151;font-weight:500}
#pl{color:#6b7280;font-size:10px;display:grid;gap:3px}
.pe{display:flex;gap:6px;white-space:nowrap}
.ph{color:#374151;font-weight:600}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);border-top:1px solid #e5e7eb;padding:8px 24px;color:#6b7280;font-size:12px;text-align:right;user-select:none;z-index:40}
.menu{display:none;position:absolute;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 4px 8px rgba(0,0,0,.1);padding:4px;z-index:10000;font-size:12px}
.menu button{display:block;width:100%;text-align:left;padding:6px 12px;background:none;border-radius:4px;color:#374151}
.menu button:hover{background:#f3f4f6}
#gate{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
#gate p{max-width:440px;line-height:1.7;font-size:15px;margin:0}
</style></head><body>
<div id="gate" class="hide">
 <p>원고를 안전하게 보관하기 위해 저장 폴더를 선택하고 권한을 허용해주세요.<br><small style="color:#6b7280">브라우저 데이터를 삭제하면 폴더 연결이 끊어질 수 있습니다. 같은 폴더를 다시 연결하면 원고가 그대로 불러와집니다.</small></p>
 <button id="gb2" class="tb pri hide" style="padding:10px 20px">이전 폴더 다시 연결</button>
 <button id="gb1" class="tb pri" style="padding:10px 20px">저장 폴더 선택하기</button>
</div>
<div id="cm" class="menu"><button id="mlock"></button><button id="mmemo"></button></div>
<div id="tm" class="menu"><button id="mren">✏️ 이름 수정</button></div>
<header>
 <div class="g">
  <button id="bd" class="tb">폴더 변경</button>
  <select id="fs"></select>
  <span id="tt" title="우클릭 또는 더블클릭하여 이름 수정">untitled</span><input id="ti" class="hide">
  <button id="bs" class="tb pri">저장</button>
  <button id="bx" class="tb exp">내보내기</button>
  <span id="st">폴더 미지정</span>
 </div>
 <div class="g">
  <button id="bf" class="tb sw" title="글씨체">굴림체</button><span class="sep"></span>
  <button id="ba" class="tb sw" title="커서가 있는 문단 정렬">양쪽</button>
  <button id="bl" class="tb sw">줄간격 1.6</button>
  <button id="bi" class="tb tg">들여쓰기</button>
  <button id="bp" class="tb tg">문단간격</button><span class="sep"></span>
  <button id="bm" class="tb sw">여백 중간</button>
  <button id="bv" class="tb tg on">뽀모</button><span class="sep"></span>
  <button id="bu" class="tb">🔓 전체 잠금 해제</button>
 </div>
</header>
<div id="area">
 <aside id="pomo"><div><button id="pb">시작</button> <b id="pd" style="margin-left:6px;color:#374151">작업중 25:00</b></div><div id="pl"></div></aside>
 <main id="main"><div id="wrap"><div id="ed" contenteditable="true" spellcheck="false"></div></div></main>
</div>
<footer id="cc">글자수 0 (0)</footer>
<script>
const $=i=>document.getElementById(i),ed=$('ed'),main=$('main'),wrap=$('wrap'),st=$('st'),cm=$('cm'),tm=$('tm');
const FONTS=[['굴림체',"Gulim,'굴림',sans-serif"],['돋움체',"Dotum,'돋움',sans-serif"],['바탕체',"Batang,'바탕',serif"]],
 FK=['gulim','dodum','batang'],LK=['tight','normal','loose'],LEAD=[1.3,1.6,2],MARG=['없음','좁음','중간','넓음'],MW=[0,1024,768,576],
 AL=[['justify','양쪽','justifyFull'],['left','왼쪽','justifyLeft'],['center','가운데','justifyCenter'],['right','오른쪽','justifyRight']],
 BLK=['DIV','P','H1','H2','H3','H4','H5','H6','LI','UL','OL','BLOCKQUOTE','PRE'];
let S={font:0,lead:1,indent:0,para:0,margin:2},dir=null,saved=null,name='untitled',dirty=false,saving=false,again=false,saveT=0,lastSave=Date.now(),
 pomoOn=true,editing=null,alignI=0,cur=[],P={run:false,work:true,left:1500,end:0,sess:false,seg:null,segs:[]},statT=0;

/* ---------- 공통 ---------- */
const say=m=>{st.textContent=m;clearTimeout(statT);statT=setTimeout(()=>st.textContent=dir?'자동저장 켜짐':'폴더 미지정',2500)};
const safe=n=>(n||'').replace(/\.(md|txt)$/i,'').replace(/[\\/:*?"<>|]/g,'_').trim()||'untitled';
const blockOf=n=>{if(!n)return null;let b=n.nodeType===3?n.parentElement:n;while(b&&b.parentElement!==ed&&b!==ed)b=b.parentElement;return b&&b!==ed&&ed.contains(b)?b:null};
const inMemo=n=>{n=n&&(n.nodeType===3?n.parentElement:n);return n&&n.closest?n.closest('.memo'):null};
const selMemo=()=>{const s=getSelection();return s.rangeCount?inMemo(s.anchorNode):null};
const locked=b=>b.classList.contains('lk');
/* 메모 제외 텍스트 (글자수·복사·내보내기 공용) */
function txt(n){let s='';for(const c of n.childNodes){if(c.nodeType===3)s+=c.nodeValue;else if(c.nodeType===1&&!c.classList.contains('memo')){if(c.tagName==='BR')s+='\n';else{s+=txt(c);if(BLK.includes(c.tagName)&&s&&!s.endsWith('\n'))s+='\n'}}}return s}
const plain=n=>txt(n).replace(/\n{3,}/g,'\n\n').trim();

/* ---------- 폴더/파일 IO ---------- */
const idb=(m,v)=>new Promise(r=>{const q=indexedDB.open('TdtdAppDB',1);q.onupgradeneeded=()=>q.result.createObjectStore('handles');q.onerror=()=>r(null);
 q.onsuccess=()=>{const o=q.result.transaction('handles',m==='get'?'readonly':'readwrite').objectStore('handles'),x=m==='get'?o.get('savedDirHandle'):o.put(v,'savedDirHandle');x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)}});
async function put(f,d){const h=await dir.getFileHandle(f,{create:true}),w=await h.createWritable();await w.write(d);await w.close()}
async function get(f){try{return await(await(await dir.getFileHandle(f)).getFile()).text()}catch(e){return null}}

/* ---------- 불러오기 보안: 허용된 태그/속성만 남김 ---------- */
function clean(html){
 const d=new DOMParser().parseFromString(html,'text/html'),out=document.createElement('div');
 (function walk(src,dst){for(const n of src.childNodes){
  if(n.nodeType===3){dst.append(n.nodeValue);continue}
  if(n.nodeType!==1)continue;
  const t=n.tagName;if(t==='SCRIPT'||t==='STYLE'||t==='IFRAME'||t==='OBJECT'||t==='EMBED')continue;
  if(!['DIV','P','BR','SPAN','B','I','U','STRONG','EM'].includes(t)&&!BLK.includes(t)){walk(n,dst);continue}
  const e=document.createElement(BLK.includes(t)&&t!=='DIV'&&t!=='P'?'DIV':t.toLowerCase());
  const m=n.classList.contains('para-memo')||n.classList.contains('memo');
  if(m){e.className='memo';e.setAttribute('contenteditable','false')}
  else if(n.classList.contains('locked-paragraph')||n.classList.contains('lk')){e.className='lk';e.setAttribute('contenteditable','false')}
  else if(n.classList.contains('has-memo'))e.className='has-memo';
  const a=/text-align:\s*(left|right|center|justify)/.exec(n.getAttribute('style')||'');if(a&&!m)e.style.textAlign=a[1];
  if(t!=='BR')walk(n,e);dst.append(e)}})(d.body,out);
 return out}
function load(html){ed.replaceChildren(...clean(html).childNodes);editing=null;refresh(true)}

/* ---------- 레이아웃 ---------- */
function layout(){
 const W=main.clientWidth;if(!W)return;
 const pn=pomoOn?256:0,mn=ed.querySelector('.memo')?340:0;let l,r;
 if(!S.margin){l=Math.max(24,pn);r=Math.max(24,mn)}
 else{const side=Math.max(24,pn,mn);let w=Math.min(MW[S.margin],W-2*side);w=Math.max(w,Math.min(320,W-48));l=r=Math.max(24,(W-w)/2)}
 wrap.style.paddingLeft=l+'px';wrap.style.paddingRight=r+'px'}
new ResizeObserver(layout).observe(main);
function syncMemos(){
 ed.querySelectorAll('.has-memo').forEach(b=>{if(!b.querySelector(':scope>.memo')){b.classList.remove('has-memo');b.style.minHeight=''}});
 ed.querySelectorAll('.memo').forEach(m=>{const b=m.parentElement;if(!b||b===ed)return;
  const f=b.querySelector(':scope>.memo');
  if(f&&f!==m){if(f.textContent.trim()&&m.textContent.trim())f.append(document.createElement('br'));f.append(...m.childNodes);if(m===editing)editing=f;m.remove();return}   // 문단이 합쳐져 메모가 둘이 되면 줄바꿈으로 병합
  const ns=m.nextSibling;if(ns&&!(ns.classList&&ns.classList.contains('memo'))&&m!==editing)b.appendChild(m);   // 메모 뒤에 글이 붙으면 메모를 다시 맨 뒤로
  b.classList.add('has-memo');
  const mb=parseFloat(getComputedStyle(b).marginBottom)||0;b.style.minHeight=Math.max(0,Math.ceil(m.offsetHeight-mb))+'px'});
 ed.querySelectorAll('.memo').forEach(m=>{if(m!==editing)m.setAttribute('contenteditable','false')})}
let rT=0;function refresh(now){clearTimeout(rT);const f=()=>{syncMemos();const t=txt(ed).trim();
 $('cc').textContent='글자수 '+t.length.toLocaleString()+' ('+t.replace(/\s/g,'').length.toLocaleString()+')';layout()};now?f():rT=setTimeout(f,200)}
function keepVisible(){
 const s=getSelection();if(!s.rangeCount)return;let b=s.getRangeAt(0).getBoundingClientRect();
 if(!b.height){const k=blockOf(s.anchorNode);if(!k)return;b=k.getBoundingClientRect()}
 const c=main.getBoundingClientRect();
 if(b.bottom>c.bottom-150)main.scrollTop+=b.bottom-(c.bottom-150);else if(b.top<c.top+20)main.scrollTop-=c.top+20-b.top}

/* ---------- UI/설정 ---------- */
function ui(){
 ed.style.fontFamily=FONTS[S.font][1];ed.style.lineHeight=LEAD[S.lead];ed.classList.toggle('ind',!!S.indent);ed.classList.toggle('gap',!!S.para);
 $('bf').textContent=FONTS[S.font][0];$('bl').textContent='줄간격 '+LEAD[S.lead].toFixed(1);$('bm').textContent='여백 '+MARG[S.margin];
 $('bi').classList.toggle('on',!!S.indent);$('bp').classList.toggle('on',!!S.para);$('bv').classList.toggle('on',pomoOn);
 $('pomo').style.display=pomoOn?'flex':'none';layout();syncMemos()}
async function persist(){
 const o={font:FK[S.font],indent:!!S.indent,leading:LK[S.lead],para:!!S.para,margin:S.margin};
 try{localStorage.setItem('tdtd_app_settings',JSON.stringify(o))}catch(e){}
 if(dir)try{await put('settings.json',JSON.stringify(o))}catch(e){}}
function applySettings(o){if(!o)return;
 S.font=Math.max(0,FK.indexOf(o.font));S.lead=LK.indexOf(o.leading)<0?1:LK.indexOf(o.leading);S.indent=o.indent?1:0;S.para=o.para?1:0;
 S.margin=Number.isInteger(o.margin)&&o.margin>=0&&o.margin<4?o.margin:2}
const cyc=(k,n)=>()=>{S[k]=(S[k]+1)%n;ui();persist()};
$('bf').onclick=cyc('font',3);$('bl').onclick=cyc('lead',3);$('bm').onclick=cyc('margin',4);
$('bi').onclick=()=>{S.indent^=1;ui();persist()};$('bp').onclick=()=>{S.para^=1;ui();persist()};
$('bv').onclick=()=>{pomoOn=!pomoOn;ui()};
/* 정렬: 커서 문단에 적용, 라벨은 현재 문단 기준 */
$('ba').onmousedown=e=>e.preventDefault();
$('ba').onclick=()=>{const s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))ed.focus();
 alignI=(alignI+1)%4;document.execCommand(AL[alignI][2]);$('ba').textContent=AL[alignI][1];ed.focus();input()};
let aT=0;document.addEventListener('selectionchange',()=>{if(aT)return;aT=requestAnimationFrame(()=>{aT=0;const s=getSelection();
 if(!s.rangeCount||!ed.contains(s.anchorNode))return;let a=getComputedStyle(blockOf(s.anchorNode)||ed).textAlign;if(a==='start')a='left';
 const i=AL.findIndex(x=>x[0]===a);if(i>=0){alignI=i;$('ba').textContent=AL[i][1]}})});

/* ---------- 저장 ---------- */
function draft(){try{localStorage.setItem('tdtd_draft',JSON.stringify({name,html:ed.innerHTML}))}catch(e){}}
async function save(){
 if(!dir){draft();return}
 if(saving){again=true;return}
 saving=true;clearTimeout(saveT);
 try{const html=ed.innerHTML;await put(name+'.md',html);lastSave=Date.now();if(html===ed.innerHTML){dirty=false;localStorage.removeItem('tdtd_draft')}
  localStorage.setItem('tdtd_last_file',name+'.md');say('저장됨')}
 catch(e){say('저장 실패 — 재시도 중');draft();saveT=setTimeout(save,5000)}
 finally{saving=false;if(again){again=false;save()}}}
const flush=async()=>{if(dirty){clearTimeout(saveT);while(saving)await new Promise(r=>setTimeout(r,50));await save()}};
function input(){
 dirty=true;st.textContent='저장 중...';refresh();requestAnimationFrame(keepVisible);
 clearTimeout(saveT);saveT=setTimeout(()=>{draft();save()},1000);
 if(Date.now()-lastSave>15000){draft();save()}}
/* 문단 병합/삭제 시 메모 유실 방지: 지우기 전에 관련 문단의 메모를 떼어 두었다가, 합쳐진 문단에 다시 붙임(메모가 둘이면 syncMemos가 줄바꿈으로 병합) */
let stash=null;
ed.addEventListener('beforeinput',e=>{
 if(!e.inputType.startsWith('delete')||e.isComposing||selMemo())return;
 const s=getSelection();if(!s.rangeCount)return;const r=s.getRangeAt(0),a=blockOf(r.startContainer),z=blockOf(r.endContainer);let bs=[];
 if(r.collapsed){if(!a)return;const q=document.createRange();q.selectNodeContents(a);
  if(e.inputType.includes('Backward')){q.setEnd(r.startContainer,r.startOffset);if(!q.toString())bs=[a.previousElementSibling,a]}
  else{q.setStart(r.startContainer,r.startOffset);const m=a.querySelector(':scope>.memo');if(q.toString()===(m?m.textContent:''))bs=[a,a.nextElementSibling]}}
 else if(a&&z&&a!==z)bs=[a,z];
 const ms=bs.filter(Boolean).map(b=>b.querySelector(':scope>.memo')).filter(m=>m&&m!==editing);
 if(ms.length){ms.forEach(m=>m.remove());stash=ms}});
ed.addEventListener('input',e=>{
 if(stash){const b=blockOf(getSelection().anchorNode)||ed.firstElementChild;if(b)b.append(...stash);stash=null;refresh(true)}
 if(e.inputType==='insertParagraph'&&!selMemo()){   // 엔터로 문단이 쪼개지면 메모는 앞쪽 문단에 남김
  const b=blockOf(getSelection().anchorNode),pv=b&&b.previousElementSibling,m=b&&b.querySelector(':scope>.memo');
  if(m&&pv&&BLK.includes(pv.tagName)&&!pv.querySelector(':scope>.memo')&&m!==editing){pv.appendChild(m);refresh(true)}}
 if(e.data==='.'&&!e.isComposing){const s=getSelection(),n=s.anchorNode,o=s.anchorOffset;   // ... → …
  if(s.isCollapsed&&n&&n.nodeType===3&&o>=3&&n.nodeValue.slice(o-3,o)==='...'){const r=document.createRange();r.setStart(n,o-3);r.setEnd(n,o);s.removeAllRanges();s.addRange(r);document.execCommand('insertText',false,'…')}}
 ensure();input()});
/* 따옴표: 직선 " ' → 앞뒤 구분되는 “ ” ‘ ’ (앞 글자가 없거나 공백·여는 괄호면 여는 따옴표) */
ed.addEventListener('beforeinput',e=>{
 if(e.inputType!=='insertText'||e.isComposing||(e.data!=='"'&&e.data!=="'"))return;
 const s=getSelection();if(!s.rangeCount)return;e.preventDefault();
 const r=s.getRangeAt(0).cloneRange();let pv='';
 try{r.collapse(true);r.setStart(selMemo()||blockOf(s.anchorNode)||ed,0);pv=r.toString().slice(-1)}catch(x){}
 const open=!pv||/[\s(\[{<\u2014\u2013\u00a0“‘]/.test(pv);
 document.execCommand('insertText',false,e.data==='"'?(open?'“':'”'):(open?'‘':'’'))});
addEventListener('pagehide',()=>{if(dirty)draft()});
addEventListener('beforeunload',e=>{if(dirty){draft();e.preventDefault();e.returnValue=''}});
$('bs').onclick=async()=>{if(!dir)return say('먼저 저장 폴더를 지정해주세요');dirty=true;await save();await list()};
async function list(){
 const f=$('fs');f.innerHTML='<option value="">파일 목록</option><option value="+">＋ 새 파일</option>';
 if(!dir)return;const a=[];for await(const e of dir.values())if(e.kind==='file'&&e.name.endsWith('.md'))a.push(e.name);
 a.sort((x,y)=>x.localeCompare(y,'ko')).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n.slice(0,-3);f.appendChild(o)});f.value=''}
function setName(n){name=n;$('tt').textContent=n;$('ti').value=n;showLogs()}
$('fs').onchange=async e=>{const v=e.target.value;e.target.value='';if(!v||!dir)return;await flush();closeSeg();
 if(v==='+'){const have=new Set([...$('fs').options].map(o=>o.value));let n='untitled',i=2;while(have.has(n+'.md'))n='untitled-'+i++;
  setName(n);ed.replaceChildren();refresh(true);openSeg();dirty=true;await save();return list()}
 const t=await get(v);if(t===null){openSeg();return say('파일 읽기 실패')}setName(v.slice(0,-3));load(t);openSeg();try{localStorage.setItem('tdtd_last_file',v)}catch(x){}
 dirty=false;ed.focus()};
/* 파일명 변경: 새 이름으로 저장 후 이전 파일 삭제 (같은 이름이 있으면 중단) */
function editTitle(){tm.style.display='none';$('tt').classList.add('hide');$('ti').classList.remove('hide');$('ti').focus();$('ti').select()}
async function commitTitle(){const ti=$('ti');if(ti.classList.contains('hide'))return;ti.classList.add('hide');$('tt').classList.remove('hide');
 const n=safe(ti.value);ti.value=name;if(n===name)return;
 if(dir){if(await get(n+'.md')!==null)return say('이미 같은 이름의 파일이 있습니다');
  const old=name;await flush();setName(n);dirty=true;await save();try{await dir.removeEntry(old+'.md')}catch(e){}await renameLogs(old,n);await list()}else{const old=name;setName(n);await renameLogs(old,n)}}
$('tt').oncontextmenu=e=>{e.preventDefault();tm.style.display='block';tm.style.left=e.pageX+'px';tm.style.top=e.pageY+'px'};
$('tt').ondblclick=editTitle;$('mren').onclick=editTitle;$('ti').onblur=commitTitle;
$('ti').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commitTitle()}else if(e.key==='Escape'){$('ti').value=name;commitTitle()}};
$('bx').onclick=async()=>{const f=name+'.txt',t=plain(ed);
 if(dir)try{await put(f,t);return say('내보냄: '+f)}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=f;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};

/* ---------- 입력/복사/붙여넣기 ---------- */
ed.addEventListener('keydown',e=>{
 const m=selMemo();
 if(m&&e.key==='Enter'&&!e.isComposing){e.preventDefault();document.execCommand('insertLineBreak')}   // 메모 안 줄바꿈(문단 분할 방지)
 else if(m&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();const r=document.createRange();r.selectNodeContents(m);const s=getSelection();s.removeAllRanges();s.addRange(r)}});
ed.addEventListener('paste',e=>{e.preventDefault();let t=e.clipboardData.getData('text/plain')||'';if(selMemo())t=t.replace(/\r?\n/g,' ');document.execCommand('insertText',false,t.replace(/\r/g,''))});
ed.addEventListener('copy',e=>{const s=getSelection();if(s.isCollapsed)return;e.preventDefault();const d=document.createElement('div');d.appendChild(s.getRangeAt(0).cloneContents());e.clipboardData.setData('text/plain',plain(d))});
ed.addEventListener('mousedown',e=>setEditing(e.target.closest&&e.target.closest('.memo')));
ed.addEventListener('focusout',e=>{const m=inMemo(e.target);if(m&&m===editing&&!(e.relatedTarget&&m.contains(e.relatedTarget)))setEditing(null)});
function setEditing(m){if(editing&&editing!==m)editing.setAttribute('contenteditable','false');editing=m;if(m)m.setAttribute('contenteditable','true')}

/* ---------- 문단 잠금 / 메모 (우클릭) ---------- */
function ensure(){ // 에디터 직속 맨 텍스트를 <div>로 감싸 문단 단위로 다룸
 if(![...ed.childNodes].some(n=>n.nodeType===3&&n.nodeValue.trim()))return;
 const s=getSelection(),r=s.rangeCount?s.getRangeAt(0):null,sv=r&&[r.startContainer,r.startOffset,r.endContainer,r.endOffset];let run=[];
 const fl=()=>{if(run.some(n=>n.nodeType!==3||n.nodeValue.trim())){const d=document.createElement('div');run[0].before(d);d.append(...run)}run=[]};
 [...ed.childNodes].forEach(n=>{n.nodeType===1&&BLK.includes(n.tagName)?fl():run.push(n)});fl();
 if(sv)try{const q=document.createRange();q.setStart(sv[0],sv[1]);q.setEnd(sv[2],sv[3]);s.removeAllRanges();s.addRange(q)}catch(e){}}
function selBlocks(){
 const s=getSelection();if(!s.rangeCount||s.isCollapsed)return[];const r=s.getRangeAt(0);if(!ed.contains(r.commonAncestorContainer))return[];
 const a=[...ed.children].filter(b=>BLK.includes(b.tagName)&&r.intersectsNode(b));
 if(a.length>1){const l=a[a.length-1],p=document.createRange();p.setStart(l,0);p.setEnd(r.endContainer,r.endOffset);if(l.contains(r.endContainer)&&!p.toString())a.pop()}
 return a}
ed.addEventListener('contextmenu',e=>{
 if(e.target.closest&&e.target.closest('.memo')){cm.style.display='none';return}
 ensure();let b=selBlocks();const multi=b.length>1;
 if(!multi){const k=blockOf(e.target);if(!k){cm.style.display='none';return}b=[k]}
 e.preventDefault();cur=b;
 $('mlock').textContent=b.every(locked)?'🔓 잠금 해제':'🔒 문단 잠금';
 $('mmemo').style.display=multi?'none':'block';   // 메모는 문단 단위 → 여러 문단이면 숨김
 if(!multi)$('mmemo').textContent=b[0].querySelector(':scope>.memo')?'🗑️ 메모 삭제':'📝 메모 추가';
 cm.style.display='block';cm.style.left=e.pageX+'px';cm.style.top=e.pageY+'px'});
addEventListener('click',()=>{cm.style.display='none';tm.style.display='none'});
$('mlock').onclick=()=>{const un=cur.every(locked);
 cur.forEach(b=>{if(un){b.removeAttribute('contenteditable');b.classList.remove('lk')}else{b.setAttribute('contenteditable','false');b.classList.add('lk')}});
 if(cur.length>1)getSelection().removeAllRanges();cur=[];refresh();input()};
$('mmemo').onclick=()=>{const b=cur[0];cur=[];if(!b)return;const old=b.querySelector(':scope>.memo');
 if(old){old.remove();refresh(true);return input()}
 const m=document.createElement('span');m.className='memo';m.setAttribute('spellcheck','false');b.appendChild(m);setEditing(m);refresh(true);
 m.focus();const r=document.createRange();r.selectNodeContents(m);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);input()};
$('bu').onclick=()=>{const a=[...ed.querySelectorAll('.lk')];if(!a.length)return say('잠긴 문단이 없습니다');
 a.forEach(b=>{b.removeAttribute('contenteditable');b.classList.remove('lk')});refresh();input();say('모든 문단 잠금 해제')};

/* ---------- 뽀모도로 (시작 시각 기준 → 백그라운드에서도 정확) ---------- */
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const pshow=()=>$('pd').textContent=(P.work?'작업중 ':'휴식중 ')+fmt(Math.max(0,P.left));
$('pb').onclick=()=>{P.run=!P.run;if(P.run){P.end=Date.now()+P.left*1000;if(P.work&&!P.sess)beginSess()}$('pb').textContent=P.run?'정지':'시작'};
const cnt=()=>{const t=txt(ed).trim();return[t.length,t.replace(/\s/g,'').length]};
/* 작업(뽀모) 세션: 파일별 구간(segment)으로 시작/끝 글자수를 기록. 세션 중 다른 파일을 열면 이전 파일 구간을 닫고 새 구간을 엶 */
const openSeg=()=>{if(P.sess)P.seg={file:name,s:cnt()}};
const closeSeg=()=>{if(P.seg){P.segs.push({...P.seg,e:cnt()});P.seg=null}};
function beginSess(){P.sess=true;P.segs=[];openSeg()}
setInterval(async()=>{if(!P.run)return;P.left=Math.ceil((P.end-Date.now())/1000);
 if(P.left<=0){if(P.work){closeSeg();P.sess=false;P.work=false;P.left=300;P.end=Date.now()+300000;await record(P.segs);P.segs=[]}
  else{P.work=true;P.left=1500;P.end=Date.now()+1500000;beginSess()}}pshow()},500);
async function record(segs){
 const n=new Date(),p=x=>String(x).padStart(2,'0'),date=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`,time=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
 // 여러 파일을 거쳤다면 변화 없는 구간은 생략 (하나뿐이면 변화가 없어도 기록)
 const keep=segs.length>1?segs.filter(g=>g.s[0]!==g.e[0]||g.s[1]!==g.e[1]):segs;
 const es=keep.map(g=>({date,time,file:g.file,start:g.s[0],end:g.e[0],startNoSpace:g.s[1],endNoSpace:g.e[1]}));
 if(!es.length)return;
 let a=[];if(dir){try{a=JSON.parse(await get('pomodoro_logs.json')||'[]')}catch(x){a=[]}a.push(...es);try{await put('pomodoro_logs.json',JSON.stringify(a,null,2))}catch(x){}}else a=es;
 logs(a)}
async function renameLogs(o,n){ // 파일명을 바꾸면 이전 기록의 파일명도 같이 바꿈
 if(P.seg&&P.seg.file===o)P.seg.file=n;P.segs.forEach(g=>{if(g.file===o)g.file=n});
 if(!dir)return;let a;try{a=JSON.parse(await get('pomodoro_logs.json')||'[]')}catch(x){return}
 if(!a.some(l=>l.file===o))return;a.forEach(l=>{if(l.file===o)l.file=n});try{await put('pomodoro_logs.json',JSON.stringify(a,null,2))}catch(x){}logs(a)}
let LOGS=[];
function logs(a){if(a)LOGS=a;showLogs()}
function showLogs(){ // 현재 파일의 오늘 기록만 (최근 5개), 맨 윗줄에 오늘 요약
 const n=new Date(),p=x=>String(x).padStart(2,'0'),today=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`,N=v=>Number(v).toLocaleString(),
  sg=v=>(v>0?'+':'')+N(v),a=LOGS.filter(l=>l.file===name&&l.date===today&&l.start!==undefined),el=[];
 const row=(c,...t)=>{const d=document.createElement('div');d.className=c;t.forEach(x=>{const e=document.createElement('span');e.textContent=x;d.append(e)});return d};
 const h=row('pe ph',`${n.getMonth()+1}월 ${n.getDate()}일`);
 if(a.length){const s=a[0].startNoSpace,e=a[a.length-1].endNoSpace;h.append(Object.assign(document.createElement('span'),{textContent:`${N(s)} → ${N(e)} (${sg(e-s)})`}))}
 el.push(h);
 a.slice(-5).forEach(l=>{const d=row('pe','~'+String(l.time).slice(0,5),`${N(l.startNoSpace)} → ${N(l.endNoSpace)} (${sg(l.endNoSpace-l.startNoSpace)})`);d.title=`공백포함 ${N(l.start)} → ${N(l.end)}`;el.push(d)});
 $('pl').replaceChildren(...el)}

/* ---------- 시작 ---------- */
async function init(){
 $('gate').classList.add('hide');say('자동저장 켜짐');await list();
 const s=await get('settings.json');if(s)try{applySettings(JSON.parse(s))}catch(e){}ui();
 const l=await get('pomodoro_logs.json');if(l)try{logs(JSON.parse(l))}catch(e){}
 const last=localStorage.getItem('tdtd_last_file'),t=last&&await get(last);
 if(t!==null&&t!==undefined&&last){setName(last.slice(0,-3));load(t)}
 try{const d=JSON.parse(localStorage.getItem('tdtd_draft')||'null');   // 저장되지 못한 내용 복구
  if(d&&d.name===name&&d.html&&confirm('저장되지 않은 내용이 남아 있습니다. 복구할까요?')){load(d.html);dirty=true;save()}}catch(e){}
}
async function pick(){try{dir=await showDirectoryPicker({mode:'readwrite'});await idb('put',dir);await init()}catch(e){}}
$('gb1').onclick=pick;$('bd').onclick=async()=>{await flush();pick()};
$('gb2').onclick=async()=>{try{if(await saved.requestPermission({mode:'readwrite'})==='granted'){dir=saved;await init()}}catch(e){}};
(async()=>{
 try{applySettings(JSON.parse(localStorage.getItem('tdtd_app_settings')||'null'))}catch(e){}ui();
 saved=await idb('get');
 if(saved&&await saved.queryPermission({mode:'readwrite'})==='granted'){dir=saved;return init()}
 $('gate').classList.remove('hide');if(saved)$('gb2').classList.remove('hide')})();
</script></body></html>
